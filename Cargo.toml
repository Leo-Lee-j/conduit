[package]
name = "conduit"
version = "0.3.12"
edition = "2024"
license = "GPL-3.0-only"
publish = false
default-run = "conduit"

[dependencies]
anyhow = "1"
rust-i18n = "=4.2.4"
alacritty_terminal = { version = "=0.25.1", default-features = false }
ignore = "0.4"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit.git", rev = "11345ec002d9f182a266b5d5dd3a217090700a87", features = ["syntect"] }
raw-window-handle = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
toml = "0.8"
toml_edit = "0.22.27"
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Console", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
ureq = { version = "3", default-features = false, features = ["json", "rustls", "platform-verifier", "win-system-proxy"] }
base64 = "0.22"
ed25519-dalek = "2.2"
semver = "1"
roxmltree = "=0.20.0"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
regex = "1"
winreg = "0.55"
zip = { version = "9.7.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }
async-channel = { version = "2", optional = true }
futures-util = { version = "0.3", optional = true }
hmac = { version = "0.12", optional = true }
subtle = { version = "2", optional = true }
tokio = { version = "1", features = ["rt", "net", "sync", "time"], optional = true }

[features]
default = []
remote = ["dep:axum", "dep:async-channel", "dep:futures-util", "dep:hmac", "dep:subtle", "dep:tokio"]
gpui-fast = ["gpui-kit/gpui-fast"]
ui-tests = ["gpui-kit/test-support"]
plugin-example = []
# Opt-in test allocator; never installed in a production binary.
allocation-probe = ["ui-tests"]

[build-dependencies]
embed-resource = "=3.0.12"

[profile.dev]
debug = "limited"
# Keep app code with debug info but give it basic optimization; the GPUI
# rendering/layout hot path lives in dependencies, which get opt-level 2 below.
opt-level = 1

[profile.dev.package."*"]
# Debug builds otherwise repaint the whole UI at unoptimized speed, which makes
# window dragging and animations visibly stutter. Optimizing dependencies keeps
# iteration builds responsive without switching to a release build.
opt-level = 2
