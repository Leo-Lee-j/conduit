[package]
name = "conduit"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit.git", rev = "2963d6d880b9dffe59b48b0533bdc83c03201209" }
raw-window-handle = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Console", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[features]
default = []
gpui-fast = ["gpui-kit/gpui-fast"]

[profile.dev]
debug = "limited"
