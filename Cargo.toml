[package]
name = "conduit"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
ignore = "0.4"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit.git", rev = "2963d6d880b9dffe59b48b0533bdc83c03201209", features = ["syntect"] }
raw-window-handle = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Console", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }

[features]
default = []
gpui-fast = ["gpui-kit/gpui-fast"]
ui-tests = ["gpui-kit/test-support"]

[profile.dev]
debug = "limited"
# Keep app code with debug info but give it basic optimization; the GPUI
# rendering/layout hot path lives in dependencies, which get opt-level 2 below.
opt-level = 1

[profile.dev.package."*"]
# Debug builds otherwise repaint the whole UI at unoptimized speed, which makes
# window dragging and animations visibly stutter. Optimizing dependencies keeps
# iteration builds responsive without switching to a release build.
opt-level = 2
