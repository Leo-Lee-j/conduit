[package]
name = "conduit-shell-prototype"
version = "0.1.0"
edition = "2024"
publish = false

# Keep experimental dependencies and their lockfile out of the desktop application.
[workspace]
members = ["desktop"]
default-members = ["."]

[dependencies]
anyhow = "1"
gpui-kit = { git = "https://github.com/longbridge/gpui-kit.git", rev = "11345ec002d9f182a266b5d5dd3a217090700a87", features = ["syntect"] }
gpui-shell = { git = "https://github.com/longbridge/gpui-kit.git", rev = "11345ec002d9f182a266b5d5dd3a217090700a87", default-features = false, features = ["quickjs", "components"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tempfile = "3"
conduit = { path = "../..", optional = true }

# Prepared from the pinned revision plus the reviewable patches/ series.
[patch."https://github.com/longbridge/gpui-kit.git"]
gpui-shell = { path = ".upstream/crates/shell" }
gpui-base = { path = ".upstream/crates/base" }
gpui-component = { path = ".upstream/crates/component" }
gpui-kit = { path = ".upstream/crates/kit" }

[features]
default = []
desktop = ["dep:conduit"]
gpui-fast = ["gpui-kit/gpui-fast", "gpui-shell/gpui-fast"]
ui-tests = ["gpui-kit/test-support"]

# Upstream uses this facade to keep the Shell and LLRT on the same QuickJS types.
# Cargo does not inherit a dependency workspace's patch section.
[patch.crates-io]
rquickjs = { git = "https://github.com/longbridge/gpui-kit.git", rev = "11345ec002d9f182a266b5d5dd3a217090700a87" }

[profile.dev]
debug = "limited"
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
