name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    name: Verify release commit
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Resolve release commit
        id: source
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot resolve release commit.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - name: Reuse or wait for CI on this commit
        id: ci
        timeout-minutes: 65
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $deadline = [DateTime]::UtcNow.AddMinutes(60)
          $missing = 0
          while ($true) {
            $response = gh api --method GET "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f "head_sha=$env:RELEASE_COMMIT" -f event=push -f per_page=1
            if ($LASTEXITCODE) { throw 'Cannot inspect CI runs; refusing to skip verification.' }
            $runs = @(($response | ConvertFrom-Json).workflow_runs)
            if ($runs.Count -eq 0) {
              # A branch push and tag push can arrive before CI has been registered.
              if (++$missing -lt 4) { Start-Sleep -Seconds 10; continue }
              Write-Host 'No push CI exists for this commit; running core verification here.'
              'reused=false' >> $env:GITHUB_OUTPUT
              break
            }
            $ci = $runs[0]
            if ($ci.head_sha -cne $env:RELEASE_COMMIT -or $ci.event -cne 'push' -or $ci.head_repository.full_name -cne $env:GITHUB_REPOSITORY) {
              throw 'CI run does not belong to the release commit and repository.'
            }
            if ($ci.status -eq 'completed') {
              if ($ci.conclusion -ne 'success') { throw "CI run $($ci.id) did not pass ($($ci.conclusion)). Re-run CI before releasing." }
              Write-Host "Reusing successful CI run $($ci.id) for $env:RELEASE_COMMIT."
              'reused=true' >> $env:GITHUB_OUTPUT
              break
            }
            if ([DateTime]::UtcNow -ge $deadline) { throw "Timed out waiting for CI run $($ci.id)." }
            Write-Host "Waiting for CI run $($ci.id): $($ci.status)."
            Start-Sleep -Seconds 20
          }
      - name: Rust toolchain
        if: steps.ci.outputs.reused == 'false'
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.1
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        if: steps.ci.outputs.reused == 'false'
        with:
          shared-key: windows-msvc
          cache-on-failure: true
      - name: Core verification
        if: steps.ci.outputs.reused == 'false'
        shell: pwsh
        run: ./scripts/check-core.ps1
  build:
    name: Build Windows installer
    runs-on: windows-2025
    environment: release
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CONDUIT_UPDATE_PUBLIC_KEY: ${{ vars.CONDUIT_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Resolve release commit
        id: source
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot resolve release commit.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - name: Verify version and signing configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'A stable vX.Y.Z tag is required.' }
          if ($env:GITHUB_REPOSITORY -cne 'Leo-Lee-j/conduit') { throw 'Update repository must match src/update.rs before releasing a fork.' }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cargo metadata failed.' }
          $version = ($metadata.packages | Where-Object name -eq 'conduit').version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag must match Cargo.toml.' }
          if (-not $env:CONDUIT_UPDATE_PUBLIC_KEY) { throw 'Configure CONDUIT_UPDATE_PUBLIC_KEY in the release environment.' }
          $published = gh release list --json tagName,isDraft --limit 100 | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot inspect existing releases.' }
          if ($published | Where-Object { $_.tagName -eq $env:RELEASE_TAG -and -not $_.isDraft }) { throw 'Published versions are immutable. Use a new tag.' }
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: windows-msvc
          cache-on-failure: true
      - name: Build and package
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE) { throw 'NSIS installation failed.' }
          ./scripts/package-windows.ps1 -MakeNsis "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
      - name: Build manifest signing tool
        run: cargo build --locked --release --bin release-manifest
      - name: Retain installer and signing tool
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            target/dist/Conduit-*-windows-x64-setup.exe
            target/dist/Conduit-*-windows-x64-setup.exe.sha256
            target/release/release-manifest.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  release:
    name: Sign and publish verified installer
    needs: [validate, build]
    runs-on: windows-2025
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CONDUIT_UPDATE_PUBLIC_KEY: ${{ vars.CONDUIT_UPDATE_PUBLIC_KEY }}
    steps:
      - name: Require matching verified and packaged commits
        shell: pwsh
        env:
          VERIFIED_COMMIT: ${{ needs.validate.outputs.commit }}
          PACKAGED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          if (-not $env:VERIFIED_COMMIT -or $env:VERIFIED_COMMIT -cne $env:PACKAGED_COMMIT) {
            throw 'Verified commit does not match the packaged commit.'
          }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
      - name: Verify release tag still identifies packaged commit
        shell: pwsh
        env:
          PACKAGED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          $commit = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -or $commit -cne $env:PACKAGED_COMMIT) { throw 'Release tag changed during the build.' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: target
      - name: Generate release notes and sign manifest
        shell: pwsh
        env:
          CONDUIT_UPDATE_PRIVATE_KEY: ${{ secrets.CONDUIT_UPDATE_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = @{ tag_name = $env:RELEASE_TAG } | ConvertTo-Json
          [IO.File]::WriteAllText('target/notes-request.json', $payload)
          $notes = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" --input target/notes-request.json | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Release note generation failed.' }
          # GitHub's generated notes list PRs; direct-commit releases need a fallback.
          if ($notes.body -notmatch '(?m)^[-*]\s') {
            $published = gh release list --json tagName,isDraft --limit 100 | ConvertFrom-Json
            if ($LASTEXITCODE) { throw 'Cannot inspect published releases.' }
            $previous = @($published | Where-Object {
              -not $_.isDraft -and $_.tagName -match '^v\d+\.\d+\.\d+$' -and
              [version]$_.tagName.Substring(1) -lt [version]$env:RELEASE_TAG.Substring(1)
            } | Sort-Object { [version]$_.tagName.Substring(1) } -Descending | Select-Object -First 1)
            if ($previous.Count -eq 0) {
              $readme = Get-Content -LiteralPath README.md -Raw
              $features = [regex]::Match($readme, '(?s)## 功能\s*(.*?)\s*## ').Groups[1].Value.Trim()
              $notes.body = "Conduit 首个公开版本，支持 Windows x64。`n`n## 功能`n`n$features`n`n$($notes.body)"
            } else {
              $commits = @(git log --no-merges --format='- %s (%h)' "$($previous[0].tagName)..$env:RELEASE_TAG")
              if ($LASTEXITCODE) { throw 'Cannot generate commit changelog.' }
              $notes.body = "## 更新内容`n`n$($commits -join "`n")`n`n$($notes.body)"
            }
          }
          [IO.File]::WriteAllText('target/dist/release-notes.md', $notes.body)
          $installer = "target/dist/Conduit-$($env:RELEASE_TAG.Substring(1))-windows-x64-setup.exe"
          & ./target/release/release-manifest.exe $installer target/dist/release-notes.md
          if ($LASTEXITCODE) { throw 'Manifest signing failed.' }
      - name: Upload complete draft and publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = gh release list --json tagName,isDraft --limit 100 | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot inspect releases.' }
          if (-not ($existing | Where-Object tagName -eq $env:RELEASE_TAG)) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "Conduit $env:RELEASE_TAG" --notes-file target/dist/release-notes.md
            if ($LASTEXITCODE) { throw 'Cannot create draft release.' }
          }
          $installer = "target/dist/Conduit-$($env:RELEASE_TAG.Substring(1))-windows-x64-setup.exe"
          gh release upload $env:RELEASE_TAG $installer "$installer.sha256" target/dist/update.json target/dist/update.json.sig --clobber
          if ($LASTEXITCODE) { throw 'Release upload failed; draft retained.' }
          $release = gh release view $env:RELEASE_TAG --json assets,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -or -not $release.isDraft) { throw 'Expected a draft release.' }
          foreach ($file in @($installer, "$installer.sha256", 'target/dist/update.json', 'target/dist/update.json.sig')) {
            $local = Get-Item -LiteralPath $file
            $asset = $release.assets | Where-Object name -eq $local.Name
            if (-not $asset -or $asset.size -ne $local.Length) { throw "Asset verification failed: $file" }
          }
          gh release edit $env:RELEASE_TAG --draft=false --latest --notes-file target/dist/release-notes.md
          if ($LASTEXITCODE) { throw 'Release publication failed.' }
