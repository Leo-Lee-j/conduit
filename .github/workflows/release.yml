name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  validate:
    name: Verify release commit
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Resolve release commit
        id: source
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot resolve release commit.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - name: Reuse or wait for CI on this commit
        id: ci
        timeout-minutes: 65
        shell: pwsh
        env:
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $deadline = [DateTime]::UtcNow.AddMinutes(60)
          $missing = 0
          while ($true) {
            $response = gh api --method GET "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" -f "head_sha=$env:RELEASE_COMMIT" -f event=push -f per_page=1
            if ($LASTEXITCODE) { throw 'Cannot inspect CI runs; refusing to skip verification.' }
            $runs = @(($response | ConvertFrom-Json).workflow_runs)
            if ($runs.Count -eq 0) {
              # A branch push and tag push can arrive before CI has been registered.
              if (++$missing -lt 4) { Start-Sleep -Seconds 10; continue }
              Write-Host 'No push CI exists for this commit; running core verification here.'
              'reused=false' >> $env:GITHUB_OUTPUT
              break
            }
            $ci = $runs[0]
            if ($ci.head_sha -cne $env:RELEASE_COMMIT -or $ci.event -cne 'push' -or $ci.head_repository.full_name -cne $env:GITHUB_REPOSITORY) {
              throw 'CI run does not belong to the release commit and repository.'
            }
            if ($ci.status -eq 'completed') {
              if ($ci.conclusion -eq 'cancelled') {
                # A newer branch push can cancel CI for an otherwise valid release commit.
                Write-Host "CI run $($ci.id) was cancelled; running core verification here."
                'reused=false' >> $env:GITHUB_OUTPUT
                break
              }
              if ($ci.conclusion -ne 'success') { throw "CI run $($ci.id) did not pass ($($ci.conclusion)). Re-run CI before releasing." }
              Write-Host "Reusing successful CI run $($ci.id) for $env:RELEASE_COMMIT."
              'reused=true' >> $env:GITHUB_OUTPUT
              break
            }
            if ([DateTime]::UtcNow -ge $deadline) { throw "Timed out waiting for CI run $($ci.id)." }
            Write-Host "Waiting for CI run $($ci.id): $($ci.status)."
            Start-Sleep -Seconds 20
          }
      - name: Rust toolchain
        if: steps.ci.outputs.reused == 'false'
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.1
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        if: steps.ci.outputs.reused == 'false'
        with:
          shared-key: windows-msvc
          cache-on-failure: true
      - name: Core verification
        if: steps.ci.outputs.reused == 'false'
        shell: pwsh
        run: ./scripts/check-core.ps1
  build:
    name: Build Windows installer
    runs-on: windows-2025
    environment: release
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CONDUIT_UPDATE_PUBLIC_KEY: ${{ vars.CONDUIT_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Resolve release commit
        id: source
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot resolve release commit.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - name: Verify version and signing configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'A stable vX.Y.Z tag is required.' }
          ./scripts/prepare-release-notes.ps1 -Tag $env:RELEASE_TAG
          if ($env:GITHUB_REPOSITORY -cne 'Leo-Lee-j/conduit') { throw 'Update repository must match src/update.rs before releasing a fork.' }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cargo metadata failed.' }
          $version = ($metadata.packages | Where-Object name -eq 'conduit').version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag must match Cargo.toml.' }
          if (-not $env:CONDUIT_UPDATE_PUBLIC_KEY) { throw 'Configure CONDUIT_UPDATE_PUBLIC_KEY in the release environment.' }
          $published = gh release list --json tagName,isDraft --limit 100 | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot inspect existing releases.' }
          if ($published | Where-Object { $_.tagName -eq $env:RELEASE_TAG -and -not $_.isDraft }) { throw 'Published versions are immutable. Use a new tag.' }
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: windows-msvc
          cache-on-failure: true
      - name: Build and package
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE) { throw 'NSIS installation failed.' }
          ./scripts/package-windows.ps1 -MakeNsis "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
      - name: Build manifest signing tool
        run: cargo build --locked --release --bin release-manifest
      - name: Retain installer and signing tool
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            target/dist/Conduit-*-windows-x64-setup.exe
            target/dist/Conduit-*-windows-x64-setup.exe.sha256
            target/release/release-manifest.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  release:
    name: Sign and publish verified installer
    needs: [validate, build]
    runs-on: windows-2025
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CONDUIT_UPDATE_PUBLIC_KEY: ${{ vars.CONDUIT_UPDATE_PUBLIC_KEY }}
    steps:
      - name: Require matching verified and packaged commits
        shell: pwsh
        env:
          VERIFIED_COMMIT: ${{ needs.validate.outputs.commit }}
          PACKAGED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          if (-not $env:VERIFIED_COMMIT -or $env:VERIFIED_COMMIT -cne $env:PACKAGED_COMMIT) {
            throw 'Verified commit does not match the packaged commit.'
          }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
      - name: Verify release tag still identifies packaged commit
        shell: pwsh
        env:
          PACKAGED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          $commit = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($LASTEXITCODE -or $commit -cne $env:PACKAGED_COMMIT) { throw 'Release tag changed during the build.' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: target
      - name: Prepare release notes and sign manifest
        shell: pwsh
        env:
          CONDUIT_UPDATE_PRIVATE_KEY: ${{ secrets.CONDUIT_UPDATE_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/prepare-release-notes.ps1 -Tag $env:RELEASE_TAG -OutputPath target/dist/release-notes.md
          $installer = "target/dist/Conduit-$($env:RELEASE_TAG.Substring(1))-windows-x64-setup.exe"
          & ./target/release/release-manifest.exe $installer target/dist/release-notes.md
          if ($LASTEXITCODE) { throw 'Manifest signing failed.' }
      - name: Upload and verify draft assets
        id: draft
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = gh release list --json tagName,isDraft --limit 100 | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot inspect releases.' }
          if (-not ($existing | Where-Object tagName -eq $env:RELEASE_TAG)) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "Conduit $env:RELEASE_TAG" --notes-file target/dist/release-notes.md
            if ($LASTEXITCODE) { throw 'Cannot create draft release.' }
          }
          $release = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -or $release.isDraft -ne $true) { throw 'Expected a draft release before changing notes or assets.' }
          gh release edit $env:RELEASE_TAG --notes-file target/dist/release-notes.md
          if ($LASTEXITCODE) { throw 'Cannot update draft release notes.' }
          $installer = "target/dist/Conduit-$($env:RELEASE_TAG.Substring(1))-windows-x64-setup.exe"
          gh release upload $env:RELEASE_TAG $installer "$installer.sha256" target/dist/update.json target/dist/update.json.sig --clobber
          if ($LASTEXITCODE) { throw 'Release upload failed; draft retained.' }
          $release = gh release view $env:RELEASE_TAG --json assets,isDraft,databaseId | ConvertFrom-Json
          if ($LASTEXITCODE -or $release.isDraft -ne $true) { throw 'Expected a draft release.' }
          foreach ($file in @($installer, "$installer.sha256", 'target/dist/update.json', 'target/dist/update.json.sig')) {
            $local = Get-Item -LiteralPath $file
            $asset = $release.assets | Where-Object name -eq $local.Name
            if (-not $asset -or $asset.size -ne $local.Length) { throw "Asset verification failed: $file" }
          }
          "release-id=$($release.databaseId)" >> $env:GITHUB_OUTPUT
      - name: Publish verified draft with retry
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release-id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:RELEASE_ID -notmatch '^\d+$') { throw 'Missing verified draft release ID.' }
          $endpoint = "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          $latestEndpoint = "repos/$env:GITHUB_REPOSITORY/releases/latest"
          function Invoke-ReleaseApi([string[]]$Arguments) {
            $response = & gh api @Arguments 2>&1
            if ($LASTEXITCODE) { throw ($response -join "`n") }
            return ($response -join "`n") | ConvertFrom-Json
          }
          function Assert-Release($Release) {
            if ($Release.tag_name -cne $env:RELEASE_TAG -or $Release.prerelease -ne $false -or $Release.draft -isnot [bool]) {
              throw 'Release identity or stability does not match the verified draft.'
            }
          }
          $published = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              # A failed PATCH may already have published the draft. Read it by ID
              # before retrying; never upload assets or rewrite notes in this loop.
              $release = Invoke-ReleaseApi @($endpoint)
              Assert-Release $release
              if ($release.draft) {
                $null = Invoke-ReleaseApi @('--method', 'PATCH', $endpoint, '-F', 'draft=false', '-f', "tag_name=$env:RELEASE_TAG", '-f', 'make_latest=true')
                $release = Invoke-ReleaseApi @($endpoint)
                Assert-Release $release
                if ($release.draft) { throw 'Release is still a draft after publication.' }
              }
              $latest = Invoke-ReleaseApi @($latestEndpoint)
              if ($latest.id -ne $release.id) {
                # Publication may have succeeded without the Latest update.
                $null = Invoke-ReleaseApi @('--method', 'PATCH', $endpoint, '-f', "tag_name=$env:RELEASE_TAG", '-f', 'make_latest=true')
                $latest = Invoke-ReleaseApi @($latestEndpoint)
              }
              if ($latest.id -ne $release.id) { throw 'Release is not yet Latest.' }
              $published = $true
              Write-Host "Published $env:RELEASE_TAG and verified Latest."
              break
            }
            catch {
              $message = $_.Exception.Message
              # Retry transient API/network failures and delayed state visibility.
              $transient = $message -match '(?i)HTTP (408|429|5\d\d)\b|\b(timeout|timed out|connection|TLS|EOF)\b|still a draft|not yet Latest'
              if (-not $transient -or $attempt -eq 5) {
                throw "Release publication could not be confirmed (release $env:RELEASE_ID). Uploaded assets were retained; inspect the release before retrying. $message"
              }
              $delay = 5 * [math]::Pow(2, $attempt - 1)
              Write-Warning "Publication attempt $attempt failed; checking state again in $delay seconds. $message"
              Start-Sleep -Seconds $delay
            }
          }
          if (-not $published) { throw 'Release publication was not confirmed.' }
