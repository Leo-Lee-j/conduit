name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2025
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      CONDUIT_UPDATE_PUBLIC_KEY: ${{ vars.CONDUIT_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Verify version and signing configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'A stable vX.Y.Z tag is required.' }
          if ($env:GITHUB_REPOSITORY -cne 'Leo-Lee-j/conduit') { throw 'Update repository must match src/update.rs before releasing a fork.' }
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cargo metadata failed.' }
          $version = ($metadata.packages | Where-Object name -eq 'conduit').version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag must match Cargo.toml.' }
          if (-not $env:CONDUIT_UPDATE_PUBLIC_KEY) { throw 'Configure CONDUIT_UPDATE_PUBLIC_KEY in the release environment.' }
          $published = gh release list --json tagName,isDraft --limit 100 | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot inspect existing releases.' }
          if ($published | Where-Object { $_.tagName -eq $env:RELEASE_TAG -and -not $_.isDraft }) { throw 'Published versions are immutable. Use a new tag.' }
      - name: Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.1
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --test-threads=1
      - name: Build and package
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE) { throw 'NSIS installation failed.' }
          ./scripts/package-windows.ps1 -MakeNsis "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
      - name: Generate release notes and sign manifest
        shell: pwsh
        env:
          CONDUIT_UPDATE_PRIVATE_KEY: ${{ secrets.CONDUIT_UPDATE_PRIVATE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = @{ tag_name = $env:RELEASE_TAG } | ConvertTo-Json
          [IO.File]::WriteAllText('target/notes-request.json', $payload)
          $notes = gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" --input target/notes-request.json | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Release note generation failed.' }
          # GitHub's generated notes list PRs; direct-commit releases need a fallback.
          if ($notes.body -notmatch '(?m)^[-*]\s') {
            $previous = @(git tag --merged $env:RELEASE_TAG --sort=-version:refname | Where-Object {
              $_ -match '^v\d+\.\d+\.\d+$' -and [version]$_.Substring(1) -lt [version]$env:RELEASE_TAG.Substring(1)
            } | Select-Object -First 1)
            if ($LASTEXITCODE) { throw 'Cannot inspect release history.' }
            if ($previous.Count -eq 0) {
              $readme = Get-Content -LiteralPath README.md -Raw
              $features = [regex]::Match($readme, '(?s)## 功能\s*(.*?)\s*## ').Groups[1].Value.Trim()
              $notes.body = "Conduit 首个公开版本，支持 Windows x64。`n`n## 功能`n`n$features`n`n$($notes.body)"
            } else {
              $commits = @(git log --no-merges --format='- %s (%h)' "$($previous[0])..$env:RELEASE_TAG")
              if ($LASTEXITCODE) { throw 'Cannot generate commit changelog.' }
              $notes.body = "## 更新内容`n`n$($commits -join "`n")`n`n$($notes.body)"
            }
          }
          [IO.File]::WriteAllText('target/dist/release-notes.md', $notes.body)
          $installer = "target/dist/Conduit-$($env:RELEASE_TAG.Substring(1))-windows-x64-setup.exe"
          cargo run --locked --release --bin release-manifest -- $installer target/dist/release-notes.md
          if ($LASTEXITCODE) { throw 'Manifest signing failed.' }
      - name: Upload complete draft and publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = gh release list --json tagName,isDraft --limit 100 | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot inspect releases.' }
          if (-not ($existing | Where-Object tagName -eq $env:RELEASE_TAG)) {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "Conduit $env:RELEASE_TAG" --notes-file target/dist/release-notes.md
            if ($LASTEXITCODE) { throw 'Cannot create draft release.' }
          }
          $installer = "target/dist/Conduit-$($env:RELEASE_TAG.Substring(1))-windows-x64-setup.exe"
          gh release upload $env:RELEASE_TAG $installer "$installer.sha256" target/dist/update.json target/dist/update.json.sig --clobber
          if ($LASTEXITCODE) { throw 'Release upload failed; draft retained.' }
          $release = gh release view $env:RELEASE_TAG --json assets,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -or -not $release.isDraft) { throw 'Expected a draft release.' }
          foreach ($file in @($installer, "$installer.sha256", 'target/dist/update.json', 'target/dist/update.json.sig')) {
            $local = Get-Item -LiteralPath $file
            $asset = $release.assets | Where-Object name -eq $local.Name
            if (-not $asset -or $asset.size -ne $local.Length) { throw "Asset verification failed: $file" }
          }
          gh release edit $env:RELEASE_TAG --draft=false --latest --notes-file target/dist/release-notes.md
          if ($LASTEXITCODE) { throw 'Release publication failed.' }
