else if(a==='shortcut-save'){if(checkShortcut()){shortcuts[shortcutIndex].key=shortcutValue;$('#dialog').close();render();toast('快捷键已保存（演示）');}}
else if(a==='extension-tab'){state.tab[kind]=b.dataset.tab;document.body.classList.remove('detail-open');render();}
else if(a==='extension-select'){state.pick[kind]=id;render();document.body.classList.add('detail-open');}
else if(a==='extension-toggle'){const list=kind==='skills'?skills:kind==='mcp'?mcps:plugins,x=list.find(x=>x.id===id);x.enabled=!x.enabled;if(kind==='plugins'&&!x.enabled&&state.iconTheme===id)state.iconTheme='builtin';render();toast('配置启用状态已保存（演示）');}
else if(a==='extension-import'){if(kind==='skills'&&state.engineFilter.skills==='Qoder')return toast('Qoder 不支持应用内创建或导入 Skills');openDialog('本地导入演示',`<p>将示例${kind==='skills'?'技能目录':kind==='mcp'?'MCP 配置':'图标插件'}导入当前选择的引擎与范围。</p><pre>D:/workspace/import/${kind==='skills'?'SKILL.md':kind==='mcp'?'mcp.json':'icons/manifest.json'}</pre><p class="small">仅演示导入确认，不读取磁盘。</p>`,action('取消','close-dialog')+action('确认模拟导入','mock-import',`data-kind="${kind}"`,true,'primary'));}
else if(a==='extension-install'){if(kind==='skills'&&state.engineFilter.skills==='Qoder')return toast('Qoder 不支持应用内安装或导入 Skills');openDialog('安装示例',`<p>${esc(b.dataset.name)}</p><p class="inline-note">来源：演示清单。将模拟安装到 ${esc(state.scope[kind])}；未连接真实商店。</p>`,action('取消','close-dialog')+action('确认模拟安装','mock-import',`data-kind="${kind}"`,true,'primary'));}
else if(a==='mock-import'){$('#dialog').close();state.tab[kind]='installed';render();toast('模拟导入／安装完成，示例条目可在已安装列表查看');}
else if(a==='mcp-test'){const x=mcps.find(m=>m.id===id);x.status='检测中…';render();setTimeout(()=>{x.status=x.id==='issue-tracker'?'检测失败':'已连接（演示）';if(state.page==='mcp')render();toast(x.name+'：'+x.status+'，未改变会话加载状态');},700);}
else if(a==='mcp-edit')configDialog('mcp',id);
else if(a==='config-preview'){try{const parsed=JSON.parse($('#config-editor').value);if(!parsed||Array.isArray(parsed)||typeof parsed!=='object')throw Error('配置必须是 JSON 对象');$('#config-error').textContent='';$('#config-preview').innerHTML='<h3>保存预览</h3><pre>'+esc(JSON.stringify(parsed,null,2))+'</pre>';$('#config-preview').hidden=false;$('[data-action="config-save"]').disabled=state.readOnly;}catch(err){$('#config-error').textContent='配置格式错误：'+err.message;}}

else if(a==='plugin-theme'){state.iconTheme=id;render();toast('图标主题已切换（演示）');}
else if(a==='plugin-remove')openDialog('卸载插件',`<p>将从演示列表移除 ${esc(plugins.find(p=>p.id===id).name)}。若正在使用，会恢复内置文件图标。</p>`,action('取消','close-dialog')+action('确认卸载','plugin-confirm-remove',`data-id="${id}"`,true,'danger'));
else if(a==='plugin-confirm-remove'){plugins.splice(plugins.findIndex(p=>p.id===id),1);state.pick.plugins='builtin';if(state.iconTheme===id)state.iconTheme='builtin';$('#dialog').close();render();toast('插件已从演示列表移除');}
else if(a==='background-file'){state.prefs.background='本地图片';render();toast('已选择示例图片：D:/workspace/pictures/workspace.png');}
else if(a==='background-history')openDialog('背景下载历史','<div class="session-line"><span>forest-demo.jpg</span><span class="small">Wallhaven · 演示</span></div><div class="session-line"><span>workspace.png</span><span class="small">本地图片 · 演示</span></div>');
else if(a==='data-path')openDialog('数据目录','<pre>D:/workspace/profile/.conduit</pre><p class="small">示例位置。真实应用中可在文件管理器中打开。</p>');
else if(a==='config-path')openDialog('配置文件','<pre>D:/workspace/profile/.conduit/settings.json</pre><p class="small">此原型只展示位置，未读取配置内容。</p>');
else if(a==='update-check'){state.check='检查中（演示）…';render();setTimeout(()=>{state.check='检查失败（演示）：更新源暂时不可用。当前配置不受影响。';if(state.page==='maintenance')render();openDialog('更新检查详情','<p>'+state.check+'</p><p class="inline-note">可重新检查；此处没有执行真实网络请求。</p>',action('关闭','close-dialog')+action('重试','update-retry','','','primary'));},600);}
else if(a==='update-retry'){$('#dialog').close();state.check='检查完成（演示）：没有提供可安装的版本。';render();toast('模拟重试完成，未下载或安装');}
