else{const data={engines,skills,mcp,plugins}[pageKey];name=data[selection][0];sub=pageKey==='engines'?'引擎配置':pageKey==='plugins'?'应用级插件':engine+' / '+scope;if(pageKey==='engines')action=button('切换启用','engine-toggle',true,true);if(pageKey==='skills'&&skills[selection][1]!=='插件托管')action=button(skills[selection][3]==='已停用'?'恢复':'停用','skill-toggle',true,true);if(pageKey==='mcp')action=button('编辑配置','mcp-edit',false,true)+button('重新检测','mcp-test',true);if(pageKey==='plugins')action=button('使用图标','use-icons',true,true)+(selection?button('启停','plugin-toggle',false,true)+button('卸载','uninstall',false,true):'');}
$('#document-head').innerHTML='<div><div class="overline">'+title(pageKey)+' / '+E(sub)+'</div><h2>'+E(name)+'</h2></div><div class="actions"><button class="back-list" data-action="back-list">返回列表</button>'+action+'</div>';
let body;if(forms[pageKey])body=formBody();else if(pageKey==='services')body=serviceBody();else if(pageKey==='shortcuts')body=section('命令绑定',table(['命令','当前绑定','范围',''],commands.map((c,i)=>({c,i})).filter(o=>selection===0||o.c[2]===['','应用','工作区','输入框'][selection]).map(({c,i})=>[c[0],'<kbd>'+c[1]+'</kbd>',c[2],'<button data-shortcut="'+i+'">编辑</button>'])));else body=resourceBody();$('#content').innerHTML='<div class="document-body">'+body+'</div>';$('#content').scrollTop=0;
$('#edit-footer').hidden=!editing;$('#edit-footer').style.display=editing?'flex':'none';$('#edit-footer').innerHTML=editing?'<span id="edit-state">'+(dirty?'有未保存修改':'表单尚未修改')+'</span>'+button('取消','cancel-edit')+button('保存服务','save-service',true,true):'';
}
function render(){document.body.dataset.page=pageKey;nav();$('#title').textContent=title(pageKey);$('#description').textContent=desc[pageKey];$('#page-actions').innerHTML=pageKey==='services'?button('重新读取配置','refresh')+button('添加服务','add-service',true,true):['skills','mcp','plugins'].includes(pageKey)?button('本地导入','import',false,true)+button('发现','discover'):pageKey==='maintenance'?button('检查更新','check-update'):button('生效范围','scope-info');context();list();details();$('#readonly').textContent=readonly?'演示：只读':'演示：可写';$('#readonly').setAttribute('aria-pressed',String(readonly))}
function choose(i){guard(()=>{selection=i;editing=false;list();details();$('#workspace').classList.add('show-detail')})}
function act(a){if(a==='close'){closeModal();return}if(a==='keep'){pending=null;closeModal();return}if(a==='discard'){dirty=false;editing=false;closeModal();const fn=pending;pending=null;fn?.();return}if(a==='back-list'){guard(()=>$('#workspace').classList.remove('show-detail'));return}
if(a==='installed'||a==='discover'){guard(()=>{mode=a;selection=0;editing=false;render()});return}
if(a==='edit-service'){editing=true;dirty=false;details();$('#service-name').focus();return}
if(a==='cancel-edit'){guard(()=>{editing=false;details()});return}
if(a==='save-service'){if(readonly)return;const name=$('#service-name').value.trim(),endpoint=$('#service-endpoint').value.trim();if(!name||!/^https?:\/\/.+/.test(endpoint)){$('#form-error').textContent='请输入服务名称和有效的 HTTP / HTTPS 地址。';return}Object.assign(services[selection],{name,endpoint});dirty=false;editing=false;render();message('服务已保存（演示）');return}
if(a==='set-default'){if(readonly)return;defaultService=selection;defaultModel=services[selection].models[0];render();message('已设为新会话默认，已有会话保持原选择（演示）');return}
if(a==='delete-service'){modal('服务引用检查','<p>'+E(services[selection].name)+(services[selection].refs||selection===defaultService?'仍被会话或默认配置引用，不能直接删除。':'没有引用。实际应用会在确认后删除本地配置。')+'</p>',button('关闭','close'));return}
if(a==='reset-group'){if(readonly)return;forms[pageKey][selection][2].forEach(f=>values[f.id]=defaults[f.id]);details();message('已恢复当前章节（演示）');return}
if(a==='preview'){modal('界面、聊天与代码预览',section('应用界面','<div class="preview" style="font-size:'+values.ui_font_size+'px">Conduit　工作空间 / 设置</div>')+section('聊天正文','<div class="preview" style="font-size:'+values.chat_font_size+'px;line-height:'+values.chat_line_height+'">用户：字体可以独立设置吗？<br>助手：界面、聊天和代码分别管理。</div>')+section('代码','<div class="preview"><pre style="font-size:'+values.code_font_size+'px">'+(values.code_line_numbers?'1  ':'')+'const service = \"team\";\n'+(values.code_line_numbers?'2  ':'')+'connect(service);</pre></div>'),button('关闭预览','close'));return}
if(a==='skill-toggle'){if(writeDisabled())return;skills[selection][3]=skills[selection][3]==='已启用'?'已停用':'已启用';render();message('技能状态已更新（演示）');return}
if(a==='engine-toggle'){if(readonly)return;engines[selection][3]=engines[selection][3]==='已启用'?'未启用':'已启用';render();message('后续任务启用状态已改变（演示）');return}
if(a==='plugin-toggle'){if(readonly)return;plugins[selection][3]=plugins[selection][3]==='已停用'?'已启用':'已停用';render();return}
if(a==='use-icons'){if(readonly)return;plugins.forEach(p=>{if(p[3]==='使用中')p[3]='已启用'});plugins[selection][3]='使用中';render();message('已应用文件图标（演示）');return}
if(a==='mcp-test'){const i=selection;mcp[i][3]='检测中';render();setTimeout(()=>{mcp[i][3]='已连接';mcp[i][4]=3;if(pageKey==='mcp')render();message('已连接；当前会话加载由 CLI 决定（演示）')},600);return}
if(a==='mcp-edit'){modal('配置变更预览','<p>目标：'+engine+' / '+scope+'。先校验原生配置，再保存。</p><textarea id="mcp-config" aria-label="MCP配置" rows="9">{\n  "command": "node",\n  "args": ["workspace-files"],\n  "enabled": true\n}</textarea><div id="config-error" class="errors"></div>',button('取消','close')+button('保存配置','mcp-save',true,true));return}
if(a==='mcp-save'){try{JSON.parse($('#mcp-config').value)}catch(e){$('#config-error').textContent='配置 JSON 无效，请检查语法。';return}closeModal();message('配置已保存，尚未验证连接（演示）');return}
if(a==='install'){if(writeDisabled())return;modal('安装回执','<p>模拟已完成，目标：'+engine+' / '+scope+'。原型未写入文件，也未启动命令。</p>',button('返回目录','close'));return}
if(a==='refresh'||a==='check-update'){message('检查中（演示）');setTimeout(()=>message('原型未连接本机；实际检查结果由应用提供'),600);return}
if(a==='reset-prompt'){$('#prompt').value='根据当前差异生成简洁的提交说明。描述行为变化，使用与项目一致的语言。不调用工具。';message('提示词已恢复（演示）');return}
if(a==='add-service'){modal('新增本地服务','<p>原型可通过编辑“团队网关”体验名称、API 地址、凭据及保存流程。</p>',button('关闭','close')+button('体验编辑','demo-edit',true,true));return}
if(a==='demo-edit'){closeModal();selection=0;editing=true;dirty=false;render();$('#workspace').classList.add('show-detail');return}
const info={import:['本地导入','目标：'+engine+' / '+scope+'。实际应用保留完整目录，拒绝同名覆盖；原型不读取本机文件。'], 'scope-info':['生效范围','偏好立即应用；新会话默认不追改已有会话；共享服务修改影响引用它的后续请求。'],'source-edit':['在来源编辑','CCS 在 cc-switch 中管理。回到此页后重新读取配置；原型不启动外部程序。'],'hidden-models':['隐藏模型','此演示目录没有隐藏项。真实页面可恢复隐藏模型，历史引用保持可识别。'],'skill-source':['SKILL.md','来源目录中的说明、脚本与资源完整保留。托管项从插件来源管理。'],'background-local':['本地背景','实际应用使用系统文件选择器选择图片，本原型不读取本机文件。'],'background-online':['Wallhaven','保留在线搜索、选图和下载入口；原型不访问图片目录。'],'background-history':['下载历史','当前演示没有下载记录。恢复背景设置不会清除下载历史。'],'uninstall':['卸载插件','实际应用在确认后删除插件资源；本原型只演示入口。']};
const x=info[a]||['操作说明','此操作使用演示数据，未调用本机服务。'];modal(x[0],'<p>'+E(x[1])+'</p>',button('知道了','close'));}
document.addEventListener('click',e=>{let n;if(n=e.target.closest('button[data-page]')){const k=n.dataset.page,idx=n.dataset.section===undefined?undefined:Number(n.dataset.section);go(k,idx);if(innerWidth<=750)$('#workspace').classList.add('show-detail');return}if(n=e.target.closest('[data-group]')){go(lastPage[Number(n.dataset.group)]);return}if(n=e.target.closest('[data-item]')){choose(Number(n.dataset.item));return}if(n=e.target.closest('[data-action]')){if(!n.disabled)act(n.dataset.action);return}if(n=e.target.closest('[data-default-model]')){if(readonly)return;defaultService=selection;defaultModel=n.dataset.defaultModel;render();message('新会话默认模型已更新（演示）');return}if(n=e.target.closest('[data-shortcut]')){const i=Number(n.dataset.shortcut);modal('录入快捷键 · '+commands[i][0],'<p>作用范围：'+commands[i][2]+'</p><input id="key-input" class="key" type="text" aria-label="快捷键录入" value="'+commands[i][1]+'"><div id="key-error" class="errors"></div>',button('取消','close')+'<button data-key-reset="'+i+'"'+dis()+'>恢复默认</button><button data-key-save="'+i+'" class="primary"'+dis()+'>保存</button>');$('#key-input').onkeydown=ev=>{if(['Control','Shift','Alt','Meta'].includes(ev.key))return;ev.preventDefault();$('#key-input').value=[ev.ctrlKey?'Ctrl':null,ev.altKey?'Alt':null,ev.shiftKey?'Shift':null,ev.key.length===1?ev.key.toUpperCase():ev.key].filter(Boolean).join('+')};return}
if(n=e.target.closest('[data-key-save]')){const i=Number(n.dataset.keySave),v=$('#key-input').value.trim(),other=commands.find((c,j)=>j!==i&&c[1]===v);if(!v||other){$('#key-error').textContent=other?'与“'+other[0]+'”冲突。':'请录入组合键。';return}commands[i][1]=v;closeModal();details();message('快捷键已保存（演示）');return}if(n=e.target.closest('[data-key-reset]')){$('#key-input').value=['Ctrl+,','Shift Shift','Ctrl+N','Ctrl+Shift+P','Enter','Shift+Enter','Ctrl+W','Ctrl+Alt+W'][Number(n.dataset.keyReset)];$('#key-error').textContent=''}});
document.addEventListener('input',e=>{if(e.target.matches('#service-name,#service-endpoint,#service-auth')){dirty=true;$('#edit-state').textContent='有未保存修改'}if(e.target.matches('#prompt,#engine-path'))message('已自动保存（演示）')});
document.addEventListener('change',e=>{if(e.target.dataset.field){if(readonly)return;const field=Object.values(forms).flat().flatMap(g=>g[2]).find(f=>f.id===e.target.dataset.field);values[field.id]=field.type==='switch'?e.target.checked:['range','number'].includes(field.type)?Number(e.target.value):e.target.value;if(field.id==='default_service'){defaultService=services.findIndex(s=>s.name===e.target.value);defaultModel=services[defaultService].models[0];details()}if(field.id==='default_model')defaultModel=e.target.value;if(field.type==='range')e.target.nextElementSibling.textContent=e.target.value+'%';if(pageKey==='appearance'){const preview=$('#content .preview');if(preview)preview.style.fontSize=values[selection===1?'ui_font_size':selection===2?'chat_font_size':'code_font_size']+'px'}message('偏好已自动保存（演示）');return}if(e.target.id==='engine-context'){const val=e.target.value;guard(()=>{engine=val;render();message('仅切换查看引擎，新会话默认未改变')})}if(e.target.id==='scope-context'){scope=e.target.value;render()}});
$('#readonly').onclick=()=>guard(()=>{readonly=!readonly;render();message(readonly?'只读演示：浏览、搜索和检测可用':'已切回可写演示')});
$('#return').onclick=()=>guard(()=>modal('返回工作台','<p>实际应用将恢复进入设置前的两侧面板及焦点。原型没有连接正在运行的工作台。</p>',button('继续查看方案','close')));
$('#settings-search').oninput=e=>{let q=e.target.value.trim().toLowerCase();if(!q){$('#results').hidden=true;return}let hits=[];pages.forEach(p=>{if(p[1].toLowerCase().includes(q))hits.push([p[0],0,p[1],domains[p[2]]]);if(forms[p[0]])forms[p[0]].forEach((g,i)=>{g[2].forEach(f=>{if((f.label+' '+f.id).toLowerCase().includes(q))hits.push([p[0],i,f.label,p[1]+' / '+g[0]])});if(g[0].toLowerCase().includes(q))hits.push([p[0],i,g[0],p[1]])})});services.forEach((s,i)=>{if((s.name+' '+s.source).toLowerCase().includes(q))hits.push(['services',i,s.name,s.source])});for(const [k,data]of Object.entries({engines,skills,mcp,plugins}))data.forEach((r,i)=>{if(r.join(' ').toLowerCase().includes(q))hits.push([k,i,r[0],title(k)])});$('#results').hidden=false;$('#results').innerHTML=hits.length?hits.slice(0,14).map(h=>'<button data-page="'+h[0]+'" data-section="'+h[1]+'">'+E(h[2])+'<small>'+E(h[3])+'</small></button>').join(''):'<p>没有匹配项。尝试设置名称或字段名。</p>'};
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();$('#settings-search').focus()}if(e.key==='Escape'){if($('#dialog-root').children.length){closeModal();return}if(!$('#results').hidden){$('#settings-search').value='';$('#results').hidden=true;return}guard(()=>$('#workspace').classList.remove('show-detail'))}if(e.key==='Tab'&&$('#dialog-root').children.length){let f=$$('#dialog-root input,#dialog-root textarea,#dialog-root button:not(:disabled)');if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(k!==pageKey)go(k)});
pageKey=pages.some(p=>p[0]===location.hash.slice(1))?location.hash.slice(1):'services';selection=initialSection[pageKey]??0;render();
