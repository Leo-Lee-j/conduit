else if(current==='skills'){let s=skills[Number(selected)];title=s[0];subtitle='Skill / '+s[1];body='<div class="inspect-section">'+kv([['配置状态',s[3]],['范围',s[1]],['来源路径','<code>'+s[2]+'</code>'],['当前查看',engine]])+'</div><div class="inspect-section"><h3>说明</h3><p>依据仓库上下文执行对应工作流，保留技能目录中的脚本与资源。来源文件决定最终内容。</p><div class="note">已发现与未停用不代表当前会话已加载。共享目录变更会影响使用它的其他CLI。</div></div>';footer=s[1]==='插件托管'?'<small>由插件托管，请在来源管理。</small>':btn('查看 SKILL.md','skill-source')+btn(s[3]==='已停用'?'恢复':'停用','skill-toggle',true,true);}
else if(current==='mcp'){let m=mcps[Number(selected)];title=m[0];subtitle=m[1]+' / '+m[2];body='<div class="inspect-section">'+kv([['配置状态','已启用'],['检测结果',status(m[3])],['来源',m[2]+'原生配置'],['工具数量',m[4]?String(m[4]):'尚未读取'],['会话加载','由原生 CLI 决定']])+'</div><div class="inspect-section"><h3>工具列表</h3>'+(m[4]?['list_files','read_file','search_files'].map(t=>'<div class="minirow"><code>'+t+'</code><small>检测返回</small></div>').join(''):'<p>连接验证完成后展示可用工具。</p>')+'</div><div class="note">验证初始化连接并读取工具列表，不调用工具。检测成功不等于当前会话已加载。</div>';footer=btn('编辑配置','mcp-edit',false,true)+btn('重新检测','mcp-test',true);}

function modal(title,body,buttons=[]){lastFocus=document.activeElement;$('#dialog-root').innerHTML='<div class="dialog-backdrop"><section role="dialog" aria-modal="true" aria-label="'+esc(title)+'" class="dialog"><h2>'+title+'</h2>'+body+'<div class="actions">'+buttons.join('')+'</div></section></div>';setTimeout(()=>$('#dialog-root button, #dialog-root input')?.focus(),0)}
function closeModal(){$('#dialog-root').innerHTML='';lastFocus?.focus()}
function shortcut(i){let c=commands[i];modal('修改快捷键 · '+c[0],'<p>作用范围：'+c[2]+'。点击录入框，然后按组合键。</p><input class="key-recorder mono" id="key-recorder" aria-label="录入快捷键" value="'+esc(c[1])+'"><div id="key-error" class="error"></div>',[btn('取消','close-modal'),'<button data-shortcut-reset="'+i+'"'+disabled()+'>恢复默认</button>','<button class="primary" data-shortcut-save="'+i+'"'+disabled()+'>保存</button>']);$('#key-recorder').onkeydown=e=>{e.preventDefault();if(['Control','Alt','Shift','Meta'].includes(e.key))return;$('#key-recorder').value=[e.ctrlKey?'Ctrl':null,e.altKey?'Alt':null,e.shiftKey?'Shift':null,e.key.length===1?e.key.toUpperCase():e.key].filter(Boolean).join('+')}}
function selectRecord(id){guard(()=>{selected=id;serviceEdit=false;if(current==='shortcuts'){shortcut(Number(id));return}$('#records').innerHTML=resourceTable();renderInspector()})}
function perform(action){if(action==='close-modal'){closeModal();return}if(action==='keep-edit'){pending=null;closeModal();return}if(action==='discard-edit'){dirty=false;serviceEdit=false;closeModal();const fn=pending;pending=null;fn?.();return}if(action==='close-inspector'){closeInspector();return}
if(action==='edit-service'){serviceEdit=true;dirty=false;renderInspector();$('#service-name')?.focus();return}
if(action==='cancel-service'){guard(()=>{serviceEdit=false;dirty=false;renderInspector()});return}
if(action==='save-service'){if(readonly)return;const name=$('#service-name').value.trim(),host=$('#service-host').value.trim();if(!name||!/^https?:\/\/.+/.test(host)){$('#service-error').textContent='请填写服务名称和有效的 HTTP / HTTPS 地址。';return}Object.assign(services.find(s=>s.id===selected),{name,host});dirty=false;serviceEdit=false;render();notify('服务已保存（演示）');return}
if(action==='set-default'){if(readonly)return;defaultService=selected;defaultModel=services.find(s=>s.id===selected).models[0];prefs.session_service=services.find(s=>s.id===selected).name;prefs.session_model=defaultModel;render();notify('已设为新会话默认；已有会话保持原选择（演示）');return}
if(action==='appearance-preview'){selected='preview';renderInspector();return}
if(action==='discover'||action==='installed'){guard(()=>{viewMode=action==='discover'?'discover':'installed';selected=null;render()});return}
if(action==='mcp-test'){let id=selected;mcps[Number(id)][3]='检测中';render();notify('正在初始化连接（演示）');setTimeout(()=>{mcps[Number(id)][3]='已连接';mcps[Number(id)][4]=3;if(current==='mcp'){render()}notify('连接验证完成；会话加载状态由 CLI 决定（演示）')},650);return}
if(action==='mcp-edit'){modal('配置变更预览','<p>目标：'+engine+' / '+scope+'。编辑后预览原生配置修改，再保存。</p><textarea id="mcp-config" aria-label="MCP 配置" rows="8">{\n  "command": "node",\n  "args": ["workspace-files"],\n  "enabled": true\n}</textarea><div class="error" id="config-error"></div>',[btn('取消','close-modal'),btn('预览并保存','config-save',true,true)]);return}
if(action==='config-save'){try{JSON.parse($('#mcp-config').value)}catch(e){$('#config-error').textContent='配置语法无效，请检查 JSON。';return}closeModal();notify('配置已保存；连接尚未验证（演示）');return}
if(action==='skill-toggle'){if(readonly)return;let s=skills[Number(selected)];s[3]=s[3]==='已停用'?'已启用':'已停用';render();notify('Skill 状态已更新，后续由 CLI 读取（演示）');return}
if(action==='plugin-toggle'){if(readonly)return;let p=plugins[Number(selected)];p[3]=p[3]==='已停用'?'已启用':'已停用';render();return}
if(action==='use-icons'){if(readonly)return;plugins.forEach(p=>{if(p[3]==='使用中')p[3]='已启用'});plugins[Number(selected)][3]='使用中';render();notify('已应用文件图标（演示）');return}
if(action==='simulate-install'){if(readonly)return;if(engine==='Qoder'&&current!=='plugins'){notify('Qoder 的创建与导入由原生 CLI 管理');return}notify('模拟完成：目标 '+engine+' / '+scope+'；未写入本机');selected=null;viewMode='installed';render();return}
if(action==='add-service'){modal('添加服务','<p>创建本地配置时填写名称、API 地址、凭据和模型。原型中可编辑“团队网关”体验完整表单。</p>',[btn('关闭','close-modal'),btn('体验服务编辑','demo-edit',true,true)]);return}
if(action==='demo-edit'){closeModal();selected='team';serviceEdit=true;renderInspector();return}
if(action==='delete-service'){const s=services.find(x=>x.id===selected);if(s.sessions||s.id===defaultService){modal('此服务仍被引用','<p>'+esc(s.name)+'被 '+s.sessions+' 个会话或新会话默认配置引用，不能直接删除。</p>',[btn('知道了','close-modal')]);}else{modal('删除本地服务','<p>将移除 '+esc(s.name)+' 的本地配置。本原型仅修改演示数据。</p>',[btn('取消','close-modal'),btn('确认删除','confirm-delete-service',true,true)]);}return}
if(action==='confirm-delete-service'){if(readonly)return;services.splice(services.findIndex(s=>s.id===selected),1);selected=null;closeModal();render();notify('服务已删除（演示）');return}
if(action==='engine-toggle'){notify('后续任务的引擎启用状态已切换（演示）');return}
if(action==='engine-check'||action==='app-check'||action==='reload'){notify('正在检查（演示）');setTimeout(()=>notify(action==='app-check'?'演示未联网；实际版本与更新结果由应用检测':'已刷新演示状态，未连接本机'),600);return}
if(action==='reset-prompt'){$('#commit-prompt').value='根据当前差异生成简洁的提交说明。说明具体行为变化，使用与项目一致的语言。不要调用工具。';notify('提示词已恢复（演示）');return}
const texts={'scope-help':['生效范围','应用偏好立即应用；新会话默认不改写已有会话；共享服务配置会影响引用它的后续请求。'],'source-edit':['在来源管理','cc-switch 配置在原应用中编辑，回到这里重新读取配置。原型不会启动外部程序。'],'hidden-models':['隐藏模型','此演示服务没有隐藏模型。实际页面保留已选模型和历史引用，可恢复显示。'],'skill-source':['SKILL.md','# Skill\n\n来源目录中的说明、脚本与资源保持完整；在真实应用中可查看或编辑来源文件。'],'import':['本地导入','目标：'+engine+' / '+scope+'。导入保留完整目录，不覆盖同名技能。Qoder由原生CLI管理。此原型不读取本机文件。'],'background-history':['下载历史','尚无演示下载记录。实际应用保留已下载背景，可再次应用；恢复背景偏好不会清除历史。'],'pick-background':['选择背景图片','实际应用打开系统文件选择器；本原型不会读取本机文件。可调整强度并打开排版预览。'],'wallhaven':['Wallhaven 浏览','实际应用中保留搜索、选图与下载历史。此方案演示导航归属，不加载在线图片。'],'plugin-remove':['卸载插件','实际应用需要确认移除该插件。此原型只展示操作位置，未修改本机插件。']};
const t=texts[action]||['操作说明','此交互使用演示数据，未调用外部服务。'];modal(t[0],'<p>'+esc(t[1])+'</p>',[btn('知道了','close-modal')]);}
document.addEventListener('click',e=>{const page=e.target.closest('button[data-page]');if(page){const targetPage=page.dataset.page,targetField=page.dataset.focusfield,targetRecord=page.dataset.focusrecord;navigate(targetPage);if(current===targetPage&&!dirty){if(targetRecord){selected=targetRecord;$('#records').innerHTML=resourceTable();renderInspector()}if(targetField){requestAnimationFrame(()=>{const row=document.querySelector('[data-setting="'+targetField+'"]');if(row){const box=$('#records');box.scrollTop=row.offsetTop-box.offsetTop-50;row.querySelector('input,select,button')?.focus()}})}}return}const act=e.target.closest('[data-action]');if(act&&!act.disabled){perform(act.dataset.action);return}const row=e.target.closest('[data-record]');if(row){selectRecord(row.dataset.record);return}const reset=e.target.closest('[data-reset]');if(reset&&!readonly){const group=formData[current].find(g=>g[0]===reset.dataset.reset);group[1].forEach(f=>prefs[f.id]=initial[f.id]);render();notify('已恢复“'+group[0]+'”分组（演示）');return}const model=e.target.closest('[data-model]');if(model&&!readonly){defaultService=selected;defaultModel=model.dataset.model;prefs.session_service=services.find(s=>s.id===defaultService).name;prefs.session_model=defaultModel;render();notify('已设置新会话默认模型（演示）');return}const save=e.target.closest('[data-shortcut-save]');if(save&&!readonly){const i=Number(save.dataset.shortcutSave),v=$('#key-recorder').value.trim(),conflict=commands.find((c,j)=>j!==i&&c[1]===v);if(!v||conflict){$('#key-error').textContent=conflict?'与“'+conflict[0]+'”的绑定冲突。':'请录入组合键。';return}commands[i][1]=v;closeModal();render();notify('快捷键已保存（演示）');return}const resetKey=e.target.closest('[data-shortcut-reset]');if(resetKey&&!readonly){$('#key-recorder').value=['Ctrl+,','Shift Shift','Ctrl+N','Ctrl+Shift+P','Enter','Shift+Enter','Ctrl+W','Ctrl+Alt+W','Alt+Left'][Number(resetKey.dataset.shortcutReset)];$('#key-error').textContent='';}});
document.addEventListener('input',e=>{if(e.target.matches('#service-name,#service-host,#service-key')){dirty=true;$('#edit-status').textContent='有未保存的更改';}if(e.target.id==='commit-prompt')notify('提示词已自动保存（演示）');});
document.addEventListener('change',e=>{if(e.target.dataset.field){const f=Object.values(formData).flat().flatMap(g=>g[1]).find(f=>f.id===e.target.dataset.field);if(!f||readonly)return;prefs[f.id]=f.type==='toggle'?e.target.checked:['number','range'].includes(f.type)?Number(e.target.value):e.target.value;if(f.id==='session_service'){defaultService=services.find(s=>s.name===e.target.value)?.id||'team';defaultModel=services.find(s=>s.id===defaultService).models[0];prefs.session_model=defaultModel;$('#records').innerHTML=formTable();}if(f.id==='session_model')defaultModel=e.target.value;if(f.type==='range')e.target.nextElementSibling.textContent=prefs[f.id]+'%';notify('偏好已自动保存（演示）');if(current==='appearance'&&selected)renderInspector();return}if(e.target.id==='mobile-nav')navigate(pages.find(p=>p[1]===e.target.value)[0]);if(e.target.id==='modified-filter'){onlyModified=e.target.checked;$('#records').innerHTML=formTable()}if(e.target.id==='engine-context'){guard(()=>{engine=e.target.value;selected=null;render();notify('已切换查看引擎；默认配置未改变')})}if(e.target.id==='scope-context'){scope=e.target.value;selected=null;render()}});
$('#readonly-toggle').onclick=()=>guard(()=>{readonly=!readonly;render();notify(readonly?'只读演示：浏览和搜索可用，写操作禁用':'可写演示：所有数据仍为模拟')});
$('#return-workbench').onclick=()=>guard(()=>{modal('返回工作台','<p>实际应用将恢复进入设置前的侧栏、详情面板宽度及输入焦点。原型没有连接正在运行的工作台。</p>',[btn('继续查看方案','close-modal')])});
$('#settings-search').oninput=e=>{const q=e.target.value.trim().toLowerCase(),out=$('#search-results');if(!q){out.hidden=true;return}let found=[];for(const p of pages){if((p[1]+' '+p[2]).toLowerCase().includes(q))found.push([p[0],p[1],'分类']);if(formData[p[0]])for(const [g,fields]of formData[p[0]])for(const f of fields)if((f.label+' '+f.id).toLowerCase().includes(q))found.push([p[0],f.label,p[1]+' / '+g,f.id]);}services.forEach(s=>{if((s.name+' '+s.host).toLowerCase().includes(q))found.push(['services',s.name,'服务 / '+s.source,'',s.id])});for(const [key,items] of [['engines',engines],['skills',skills],['mcp',mcps],['plugins',plugins]])items.forEach((item,i)=>{if(item.join(' ').toLowerCase().includes(q))found.push([key,item[0],pageTitle(key),'',String(i)])});out.hidden=false;out.innerHTML=found.length?found.slice(0,15).map(f=>'<button data-page="'+f[0]+'" data-focusfield="'+(f[3]||'')+'" data-focusrecord="'+(f[4]??'')+'"><span>'+esc(f[1])+'</span><small>'+f[2]+'</small></button>').join(''):'<p>没有匹配项。尝试“字体”“MCP”或 ui_font_size。</p>'};
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();$('#settings-search').focus();return}if(e.key==='Escape'){if($('#dialog-root').children.length){closeModal();return}if(!$('#search-results').hidden){$('#settings-search').value='';$('#search-results').hidden=true;return}if(selected!==null){closeInspector();return}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-record]')){e.preventDefault();selectRecord(e.target.dataset.record)}if(e.key==='Tab'&&$('#dialog-root').children.length){let f=$$('#dialog-root button:not(:disabled),#dialog-root input,#dialog-root textarea').filter(x=>x.offsetParent);if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id!==current)navigate(id)});
current=pages.some(p=>p[0]===location.hash.slice(1))?location.hash.slice(1):'services';selected=current==='services'?'team':null;render();
