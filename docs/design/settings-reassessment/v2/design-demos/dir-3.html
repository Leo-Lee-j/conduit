const $=s=>document.querySelector(s);
const icons={search:'<circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/>',close:'<path d="m5 4 6 6-6 6"/>',monitor:'<rect x="2" y="2" width="12" height="9" rx="1"/><path d="M5 14h6M8 11v3"/>',check:'<path d="m3 8 3 3 7-7"/>',reset:'<path d="M3 5a5.5 5.5 0 1 1-1 5M3 1v4h4"/>'};
function icon(name){return '<svg viewBox="0 0 16 16" aria-hidden="true">'+(icons[name]||icons.monitor)+'</svg>'}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const domains=[['work','工作台'],['ai','AI 与工作流'],['extend','扩展能力'],['maintain','应用维护']];
const categories={work:[['general','通用'],['appearance','外观与字体'],['shortcuts','快捷键']],ai:[['engines','AI 引擎'],['services','模型与服务'],['sessions','会话设置'],['git','Git 工作流']],extend:[['skills','Skills'],['mcp','MCP 服务'],['plugins','插件']],maintain:[['data','数据与更新']]};
const groups=[['theme','主题'],['ui','界面'],['chat','聊天'],['code','代码'],['background','背景']];
const initial={mode:'跟随系统',lightTheme:'Conduit Light',darkTheme:'Conduit Dark',uiFont:'Segoe UI',uiSize:14,chatFont:'Segoe UI',chatSize:15,lineHeight:1.6,codeFont:'Cascadia Code',codeSize:13,lineNumbers:true,highlight:true,background:'主题默认'};
const values={...initial};
const fields=[
{id:'mode',group:'theme',name:'主题模式',type:'segment',options:['跟随系统','浅色','深色'],desc:'界面与预览跟随所选模式'},
{id:'lightTheme',group:'theme',name:'浅色主题',type:'select',options:['Conduit Light'],desc:'浅色模式使用的主题；当前仅演示内置主题'},
{id:'darkTheme',group:'theme',name:'深色主题',type:'select',options:['Conduit Dark'],desc:'深色模式使用的主题；当前仅演示内置主题'},
{id:'uiFont',group:'ui',name:'界面字体',type:'select',options:['Segoe UI','Microsoft YaHei UI','Arial'],desc:'导航、按钮和面板文字'},
{id:'uiSize',group:'ui',name:'界面字号',type:'number',min:12,max:20,step:1,unit:'px',desc:'独立调整；不改变聊天或代码字号'},
{id:'chatFont',group:'chat',name:'聊天字体',type:'select',options:['Segoe UI','Microsoft YaHei UI','Arial'],desc:'用户消息和助手正文'},
{id:'chatSize',group:'chat',name:'聊天字号',type:'number',min:12,max:24,step:1,unit:'px',desc:'影响对话阅读，不改变界面字号'},
{id:'lineHeight',group:'chat',name:'聊天行高',type:'number',min:1.2,max:2.2,step:.1,unit:'倍',desc:'调整正文行距；即时比较段落密度'},
{id:'codeFont',group:'code',name:'代码字体',type:'select',options:['Cascadia Code','Consolas','Courier New'],desc:'代码块使用独立等宽字体'},
{id:'codeSize',group:'code',name:'代码字号',type:'number',min:11,max:22,step:1,unit:'px',desc:'仅影响代码块，不改变聊天正文'},
{id:'lineNumbers',group:'code',name:'显示行号',type:'toggle',desc:'在代码块左侧显示行号'},
{id:'highlight',group:'code',name:'语法高亮',type:'toggle',desc:'使用主题颜色区分代码语法'},
{id:'background',group:'background',name:'背景来源',type:'select',options:['主题默认','纯色背景'],desc:'即时预览背景；保持内容可读'}
];
let state={domain:'work',page:'appearance',group:'all',query:'',modified:false};
let toastTimer;
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2300)}
function changed(id){return values[id]!==initial[id]}
function control(f){const v=values[f.id];if(f.type==='select')return `<select id="${f.id}" data-value="${f.id}" aria-label="${f.name}">${f.options.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
if(f.type==='number')return `<div class="value-number"><input type="number" id="${f.id}" data-value="${f.id}" min="${f.min}" max="${f.max}" step="${f.step}" value="${v}" aria-label="${f.name}"><span class="unit">${f.unit}</span><span class="limit">${f.min}–${f.max}</span></div>`;
if(f.type==='toggle')return `<button id="${f.id}" class="toggle" data-toggle="${f.id}" role="switch" aria-checked="${v}" aria-label="${f.name}"><span class="toggle-track"></span><span>${v?'开启':'关闭'}</span></button>`;
return `<div class="segmented" role="group" aria-label="${f.name}">${f.options.map(x=>`<button data-mode="${x}" class="${x===v?'active':''}" aria-pressed="${x===v}">${x}</button>`).join('')}</div>`}
function visibleFields(){const q=state.query.trim().toLowerCase();const exact=fields.some(f=>f.name.toLowerCase()===q);return fields.filter(f=>(state.group==='all'||state.group===f.group)&&(!state.modified||changed(f.id))&&(!q||(exact?f.name.toLowerCase()===q:[f.name,f.desc,values[f.id],groups.find(g=>g[0]===f.group)[1]].join(' ').toLowerCase().includes(q))))}
function renderTable(){
const visible=visibleFields();$('#result-count').textContent=visible.length+' / '+fields.length+' 项';$('#modified-count').textContent=fields.filter(f=>changed(f.id)).length;
$('#filters').innerHTML=[['all','全部'],...groups].map(([id,name])=>`<button class="filter ${state.group===id?'active':''}" data-filter="${id}" aria-pressed="${state.group===id}">${name}</button>`).join('');
if(!visible.length){$('#table-container').innerHTML='<div class="empty"><strong>没有匹配的设置</strong>试试「字体」「行高」，或清除当前筛选。<br><button id="clear-filters">清除筛选</button></div>';return}
let html='<table class="settings-table"><colgroup><col><col><col></colgroup><thead><tr><th scope="col">设置名称</th><th scope="col">当前值</th><th scope="col" class="description-head">作用范围</th></tr></thead><tbody>';
for(const [id,name] of groups){const groupFields=visible.filter(f=>f.group===id);if(!groupFields.length)continue;html+=`<tr class="group-row"><th colspan="3"><div class="group-inner"><span>${name}</span><span class="count">${groupFields.length}</span><button class="reset" data-reset="${id}" title="只恢复${name}组" aria-label="恢复${name}组默认值">${icon('reset')}恢复本组</button></div></th></tr>`;for(const f of groupFields)html+=`<tr id="row-${f.id}" class="setting-row ${changed(f.id)?'modified':''}"><td><label ${f.type!=='segment'?'for="'+f.id+'"':''}>${f.name}<span class="changed" aria-label="已修改"></span></label></td><td>${control(f)}</td><td class="description">${f.desc}</td></tr>`}
$('#table-container').innerHTML=html+'</tbody></table>';
}
function updatePreview(){const root=document.documentElement.style;root.setProperty('--chat-size',values.chatSize+'px');root.setProperty('--chat-line',values.lineHeight);root.setProperty('--chat-font',`"${values.chatFont}","Microsoft YaHei UI",sans-serif`);root.setProperty('--code-font',`"${values.codeFont}",Consolas,monospace`);root.setProperty('--code-size',values.codeSize+'px');root.setProperty('--sample-ui-size',values.uiSize+'px');root.setProperty('--sample-ui-font',`"${values.uiFont}","Microsoft YaHei UI",sans-serif`);const dark=values.mode==='深色'||values.mode==='跟随系统'&&matchMedia('(prefers-color-scheme:dark)').matches;document.body.classList.toggle('dark',dark);document.body.classList.toggle('background-solid',values.background==='纯色背景');$('#chat-meta').textContent=`${values.chatSize}px / ${values.lineHeight}`;$('#code-meta').textContent=`${values.codeSize}px`;
const lines=['fn main() {','    let message = "Hello, Conduit";','    println!("{}", message);','}'];$('#code-sample').innerHTML=lines.map((s,i)=>{let code=esc(s);if(values.highlight){code=code.replace(/\b(fn|let)\b/g,'<span class="syntax">$1</span>').replace(/(&quot;.*?&quot;)/g,'<span class="syntax-value">$1</span>')}return (values.lineNumbers?`<span class="ln">${i+1}</span>`:'')+code}).join('\n')}
function setValue(id,value,refresh=true){values[id]=value;updatePreview();$('#status').textContent='预览已更新';if(refresh||(state.modified&&!changed(id)))renderTable();else{$('#row-'+id)?.classList.toggle('modified',changed(id));$('#modified-count').textContent=fields.filter(f=>changed(f.id)).length}}
function nav(){
$('#domains').innerHTML=domains.map(([id,n])=>`<button class="domain ${id===state.domain?'active':''}" data-domain="${id}" ${id===state.domain?'aria-current="page"':''}>${n}</button>`).join('');
$('#sections').innerHTML=categories[state.domain].map(([id,n])=>`<button class="section ${id===state.page?'active':''}" data-page="${id}" ${id===state.page?'aria-current="page"':''}>${n}</button>`).join('')+`<span class="scope">${icon('monitor')}本机偏好</span>`;
$('#page-title').textContent=categories[state.domain].find(c=>c[0]===state.page)?.[1]||'设置';
}
function stub(){const name=$('#page-title').textContent;let detail='';
if(state.page==='sessions')detail='<div class="sample-row"><div>新会话默认模型<small>用于未来新会话，已有会话保留原设置。</small></div><select aria-label="新会话默认模型"><option>服务默认模型</option></select></div><div class="sample-row"><div>会话命名<small>命名配置独立于聊天模型。</small></div><span>结构示例</span></div>';
if(state.page==='services')detail='<div class="sample-row"><div>本地 CLI<small>示例来源，继承原生配置。</small></div><span>结构示例</span></div><p>编辑共享服务时，引用同一服务的已有会话在后续使用时可能读取更新后的配置。</p>';
if(state.page==='engines')detail='<p>浏览引擎只改变当前查看对象；设置默认引擎需要单独操作。</p>';
if(state.page==='shortcuts')detail='<div class="sample-row"><span>筛选外观设置</span><kbd>Ctrl K</kbd></div><div class="sample-row"><span>清除筛选</span><kbd>Esc</kbd></div>';
$('#table-container').innerHTML=`<div class="stub"><h2>${name}</h2><p>分类结构示例。本轮完整交互集中在「外观与字体」。</p>${detail}<button class="return" id="return">返回外观与字体</button></div>`;
}
function render(){nav();const appearance=state.page==='appearance';$('#tools').hidden=!appearance;$('#tools').style.display=appearance?'':'none';$('#preview').hidden=!appearance;$('#preview').style.display=appearance?'':'none';$('#search').placeholder=appearance?'筛选名称、当前值或作用范围':'输入以筛选外观设置';if(appearance)renderTable();else stub();updatePreview()}
function clearFilters(){state.query='';state.group='all';state.modified=false;$('#modified').checked=false;$('#search').value='';$('#clear-search').hidden=true;renderTable()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.domain){state.domain=b.dataset.domain;state.page=categories[state.domain][0][0];render()}
else if(b.dataset.page){state.page=b.dataset.page;render()}
else if(b.dataset.filter){state.group=b.dataset.filter;renderTable()}
else if(b.dataset.reset){const g=b.dataset.reset;for(const f of fields.filter(f=>f.group===g))values[f.id]=initial[f.id];renderTable();updatePreview();$('#status').textContent='已恢复'+groups.find(x=>x[0]===g)[1]+'组默认值';toast('本组已恢复，其它设置保持原值')}
else if(b.dataset.mode){setValue('mode',b.dataset.mode,false);document.querySelectorAll('[data-mode]').forEach(el=>{el.classList.toggle('active',el.dataset.mode===values.mode);el.setAttribute('aria-pressed',el.dataset.mode===values.mode)})}
else if(b.dataset.toggle){setValue(b.dataset.toggle,!values[b.dataset.toggle],false);b.setAttribute('aria-checked',values[b.dataset.toggle]);b.lastElementChild.textContent=values[b.dataset.toggle]?'开启':'关闭'}
else if(b.id==='clear-search'||b.id==='clear-filters'){clearFilters();$('#search').focus()}
else if(b.id==='return'){state.domain='work';state.page='appearance';clearFilters();render()}
else if(b.id==='close'){toast('这是独立设计预览，可关闭页面返回工作台')}
});
document.addEventListener('change',e=>{const id=e.target.dataset.value;if(!id)return;const f=fields.find(f=>f.id===id);if(f.type==='number'){let n=Number(e.target.value);if(!Number.isFinite(n))n=initial[id];n=Math.min(f.max,Math.max(f.min,Math.round(n/f.step)*f.step));n=+n.toFixed(1);e.target.value=n;setValue(id,n,false)}else setValue(id,e.target.value,false)});
document.addEventListener('input',e=>{const id=e.target.dataset.value;if(!id||e.target.type!=='number')return;const f=fields.find(f=>f.id===id);const n=Number(e.target.value);if(e.target.value!==''&&Number.isFinite(n)&&n>=f.min&&n<=f.max)setValue(id,n,false)});
$('#search').addEventListener('input',()=>{state.query=$('#search').value;$('#clear-search').hidden=!state.query;if(state.page!=='appearance'){state.domain='work';state.page='appearance';render()}else renderTable()});
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('.setting-row input,.setting-row select,.setting-row button')?.focus()}});
$('#modified').addEventListener('change',e=>{state.modified=e.target.checked;renderTable()});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus();$('#search').select()}if(e.key==='Escape'&&state.page==='appearance'){clearFilters();$('#search').focus()}});
document.querySelectorAll('.logo').forEach(i=>i.src=LOGO);$('#search-icon').innerHTML=icon('search');$('#status-icon').innerHTML=icon('check');$('#ui-icon').innerHTML=icon('monitor');$('#close').innerHTML=icon('close');render();
</script></body></html>
