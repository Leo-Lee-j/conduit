function options(list,current){return list.map(v=>`<option ${v===current?'selected':''}>${esc(v)}</option>`).join('');}
function selectField(key,list){return`<select class="field-select" data-value="${key}" id="${key}" aria-label="${esc(searchItems.find(x=>x[5]===key)?.[0]||key)}">${options(list,values[key])}</select>`;}
function row(key,label,desc,control){return`<div class="form-row" id="row-${key}"><div class="form-label"><label for="${key}">${esc(label)}</label>${desc?`<small>${esc(desc)}</small>`:''}</div>${control}</div>`;}
function range(key,min,max){return`<div class="range-control"><input id="${key}" aria-label="${key==='uiSize'?'界面字号':key==='chatSize'?'聊天字号':'代码字号'}" type="range" min="${min}" max="${max}" value="${values[key]}" data-value="${key}"><div class="stepper"><button data-step="${key}" data-delta="-1" aria-label="减小字号">−</button><output id="value-${key}">${values[key]} px</output><button data-step="${key}" data-delta="1" aria-label="增大字号">+</button></div></div>`;}
function toggle(key,label){return`<button class="switch" id="${key}" role="switch" aria-label="${label}" aria-checked="${values[key]}" data-toggle="${key}"><span class="switch-track"></span></button>`;}
function preview(code=false){return`<div class="preview-head"><h3>阅读预览</h3><p>${icon('check')}<span>跟随当前调整</span></p></div><div class="preview"><div class="preview-toolbar"><span>Conduit 对话</span><span>示例内容</span></div><div class="conversation"><div class="question">帮我检查这次提交里的设置改动。</div><div class="answer-title"><img src="${LOGO}" alt="">Conduit</div><p>设置应该让每一次调整都清楚可见。</p><ul><li>界面、聊天与代码使用独立的字体设置。</li><li>修改新会话默认值时，已有会话保持原配置。</li></ul>${code?`<pre class="code-sample"><span class="kw">const</span> preferences = {
  fontSize: ${values.chatSize},
  lineHeight: ${values.lineHeight}
};</pre>`:''}</div></div>`;}
function head(title,desc,reset=true){return`<div class="detail-head"><div><h2 tabindex="-1" id="detail-title">${esc(title)}</h2><p>${esc(desc)}</p></div>${reset?`<button class="text-button" id="reset" aria-label="重置当前组">${icon('reset')}重置当前组</button>`:'<span class="tag">结构示例</span>'}</div>`;}
function appearance(){
 if(state.task==='chat')return head('聊天文字','作用于对话正文与输入框。')+`<div class="form">${row('chatFont','字体','选择已安装的本机字体。',selectField('chatFont',['系统默认','Microsoft YaHei UI','Segoe UI']))}${row('chatSize','字号','先找到舒适的阅读大小。',range('chatSize',12,24))}${row('lineHeight','行距','调整对话段落的阅读节奏。',`<div class="segmented" role="group" aria-label="聊天行距">${[1.5,1.7,1.9].map(n=>`<button data-line="${n}" class="${values.lineHeight===n?'active':''}" aria-pressed="${values.lineHeight===n}">${n}</button>`).join('')}</div>`)}</div>`+preview();
 if(state.task==='interface')return head('界面文字','作用于菜单、按钮、标签与设置界面。')+row('uiFont','字体','系统默认会使用本机界面字体。',selectField('uiFont',['系统默认','Microsoft YaHei UI','Segoe UI']))+row('uiSize','字号','应用界面与聊天、代码字号独立。',range('uiSize',12,20))+`<div class="preview-head"><h3>界面预览</h3><p>局部展示字号效果</p></div><div class="preview" style="padding:24px;font-size:${values.uiSize}px;font-family:${values.uiFont==='系统默认'?'var(--ui-font)':esc(values.uiFont)}"><div style="display:flex;gap:12px;align-items:center;margin-bottom:18px">${icon('folder')}工作区<span style="margin-left:auto;color:var(--muted)">新建会话</span></div><div style="padding:14px;background:var(--tint);border-radius:5px;color:var(--accent)">设置菜单设计评审</div><div style="padding:14px;color:var(--muted)">检查未提交的代码改动</div></div>`;
 if(state.task==='code')return head('代码','独立调整对话中代码块的可读性。')+row('codeFont','等宽字体','用于代码块与代码预览。',selectField('codeFont',['系统等宽字体','Consolas','Cascadia Code']))+row('codeSize','字号','保留代码的缩进与字符对齐。',range('codeSize',12,20))+row('lineNumbers','显示行号','便于定位与引用代码。',toggle('lineNumbers','显示代码行号'))+row('highlight','语法高亮','通过颜色区分代码结构。',toggle('highlight','语法高亮'))+preview(true);
 if(state.task==='theme')return head('主题','选择显示模式，或跟随系统自动切换。')+`<div class="theme-options">${['跟随系统','浅色','深色'].map((v,i)=>`<button class="theme-option ${values.mode===v?'active':''}" data-mode="${v}" aria-pressed="${values.mode===v}"><div class="mini-ui ${['system','','dark'][i]}"><div class="mini-nav"></div><div class="mini-content"><i></i><i></i><i style="width:65%"></i></div></div><strong>${v}</strong></button>`).join('')}</div>`+row('lightTheme','浅色主题','浅色模式下使用。','<select class="field-select" id="lightTheme" aria-label="浅色主题"><option>Conduit Light</option></select>')+row('darkTheme','深色主题','深色模式下使用。','<select class="field-select" id="darkTheme" aria-label="深色主题"><option>Conduit Dark</option></select>')+preview();
 return head('背景','让阅读内容保持清楚。')+row('background','背景来源','当前方向先验证纯色背景的阅读效果。',selectField('background',['主题默认','纯色背景']))+preview();
}
function otherPage(){
 const title=categories[state.domain].find(x=>x[0]===state.page)?.[1]||'设置';
 if(state.page==='sessions'){
  if(state.task==='display')return head('聊天显示','影响现有对话的显示方式，不改变模型输出。',false)+row('reasoning','折叠推理过程','保留正文阅读空间。',toggle('reasoning','折叠推理过程'))+row('questions','折叠问题历史','需要时再展开查看。',toggle('questions','折叠问题历史'))+preview();
  if(state.task==='naming')return head('自动命名','自动命名使用独立配置，不改变聊天模型。',false)+row('autoName','自动生成会话标题','首轮对话完成后生成简短标题。',toggle('autoName','自动生成会话标题'))+`<div class="note">模型与触发方式将在选定方向后展开完整设计。本页只演示导航、范围说明和开关反馈。</div>`;
  return head('新会话默认','用于未来新会话；已有会话保留原设置。',false)+row('engine','浏览引擎','浏览只改变当前查看对象。','<select id="engine" class="field-select" aria-label="浏览引擎"><option>本地 CLI</option></select>')+row('model','默认模型','按本地 CLI 的原有配置启动。','<select id="model" class="field-select" aria-label="默认模型"><option>服务默认模型</option></select>')+`<div class="note">模型来源与默认权限属于不同设置。切换模型不代表修改权限。</div>`;
 }
 if(state.page==='services')return head(state.task==='defaults'?'默认选择':'服务来源','查看来源与明确设置默认值分开操作。',false)+`<div class="service-row">${icon('engine')}<div><h3>本地 CLI</h3><small>示例来源，继承原生配置</small></div><button class="text-button" data-info="本原型仅展示服务详情入口，不读取本机 CLI。">查看详情 ${icon('arrow')}</button></div><div class="note">编辑共享服务时，引用同一服务的已有会话在后续使用时可能读取更新后的配置。</div><button class="text-button" data-info="新增服务表单将在方向选定后细化。">${icon('box')}添加服务</button>`;
 if(state.page==='shortcuts')return head('快捷键','优先展示高频动作，支持搜索定位。',false)+`<div class="form-row"><span>搜索设置</span><kbd>Ctrl F</kbd></div><div class="form-row"><span>关闭搜索结果</span><kbd>Esc</kbd></div><div class="note">快捷键在此 HTML 预览中可使用；完整应用快捷键表将在落地时复用现有定义。</div>`;
 return head(title,'此页展示相同的导航与内容层级。',false)+`<div class="service-row">${icon((pageTasks[state.page]||[])[0]?.[1])}<div><h3>${esc((pageTasks[state.page]||[]).find(x=>x[0]===state.task)?.[2]||title)}</h3><small>保留当前应用的功能入口</small></div></div><div class="note">本轮以「外观与字体」完整验证视觉与交互，也提供会话设置、模型与服务示例。此分类暂未展开详细表单。</div><button class="text-button" id="back-appearance">${icon('back')}查看完整的外观设计</button>`;
}
function nav(){
 $('#domains').innerHTML=domains.map(([id,label,i])=>`<button class="domain ${state.domain===id?'active':''}" data-domain="${id}" ${state.domain===id?'aria-current="page"':''}>${icon(i)}${label}</button>`).join('');
 $('#sections').innerHTML=categories[state.domain].map(([id,label])=>`<button class="section-tab ${state.page===id?'active':''}" data-page="${id}" ${state.page===id?'aria-current="page"':''}>${label}</button>`).join('')+`<span class="scope">${icon('monitor')}本机偏好</span>`;
 const title=categories[state.domain].find(x=>x[0]===state.page)?.[1]||'设置';$('#page-title').textContent=title;$('#page-desc').textContent=state.page==='appearance'?'把界面、对话与代码调到合适的阅读状态。':state.page==='sessions'?'把新会话默认与聊天显示分开管理。':state.page==='services'?'查看来源、管理配置，明确每次修改的范围。':'按类别浏览，或直接搜索具体设置。';
 const list=state.page==='appearance'?tasks:pageTasks[state.page]||[];
 $('#tasks').innerHTML='<div class="task-label"><span>此页设置</span><span>'+list.length+' 项</span></div>'+list.map(([id,i,label])=>`<button class="task ${state.task===id?'active':''} ${changed(id)?'modified':''}" data-task="${id}" ${state.task===id?'aria-current="page"':''}>${icon(i)}<span><strong>${label}</strong><small>${summary(id)}</small></span><span class="dot" aria-label="已修改"></span></button>`).join('')+'<div class="find-note">记不清设置在哪？<br>搜索名称或当前值即可定位。</div>';
 $('#task-select').innerHTML=list.map(([id,,label])=>`<option value="${id}" ${state.task===id?'selected':''}>${label}</option>`).join('');
}
function updatePreview(){
 document.documentElement.style.setProperty('--chat-size',values.chatSize+'px');document.documentElement.style.setProperty('--line-height',values.lineHeight);document.documentElement.style.setProperty('--code-size',values.codeSize+'px');document.documentElement.style.setProperty('--chat-font',values.chatFont==='系统默认'?'"Segoe UI","Microsoft YaHei UI",sans-serif':values.chatFont);document.documentElement.style.setProperty('--code-font',values.codeFont==='系统等宽字体'?'"Cascadia Code",Consolas,monospace':values.codeFont);
 const dark=values.mode==='深色'||values.mode==='跟随系统'&&matchMedia('(prefers-color-scheme:dark)').matches;
 document.body.classList.toggle('dark-mode',dark);
 document.querySelectorAll('.preview').forEach(p=>p.style.background=values.background==='纯色背景'?(dark?'#252d28':'#ffffff'):'');
 if($('#value-chatSize'))$('#value-chatSize').textContent=values.chatSize+' px';if($('#value-codeSize'))$('#value-codeSize').textContent=values.codeSize+' px';if($('#value-uiSize'))$('#value-uiSize').textContent=values.uiSize+' px';
 if($('.code-sample')){const text=[`const preferences = {`,`  fontSize: ${values.chatSize},`,`  lineHeight: ${values.lineHeight}`,`};`];$('.code-sample').innerHTML=text.map((s,i)=>(values.lineNumbers?`<span class="muted">${i+1}  </span>`:'')+(values.highlight&&i===0?esc(s).replace('const','<span class="kw">const</span>'):esc(s))).join('\n');}
}
function render(focus=false){nav();$('#detail').innerHTML=state.page==='appearance'?appearance():otherPage();updatePreview();$('.detail').scrollTop=0;if(focus)$('#detail-title')?.focus({preventScroll:true});}
function setValue(key,value){values[key]=value;updatePreview();nav();status('预览已更新');}
function go(domain,page,task,key=''){state={domain,page,task};$('#search').value='';$('#results').hidden=true;render(true);if(key){const el=$('#row-'+key)||$('#'+key);el?.classList.add('highlight');el?.querySelector('input,select,button')?.focus({preventScroll:true});}}
function results(){const q=$('#search').value.trim().toLowerCase();if(!q){$('#results').hidden=true;return;}const list=searchItems.filter(x=>(x[0]+' '+x[1]+' '+(values[x[5]]??'')).toLowerCase().includes(q));$('#results').hidden=false;$('#results').innerHTML=list.length?list.map(x=>`<button class="result" data-result="${searchItems.indexOf(x)}">${icon('search')}<span><strong>${esc(x[0])}</strong><small>${domains.find(d=>d[0]===x[2])[1]} / ${categories[x[2]].find(c=>c[0]===x[3])[1]}${x[5]&&values[x[5]]!==undefined?' · '+esc(values[x[5]]):''}</small></span>${icon('arrow')}</button>`).join(''):'<div class="empty">没有匹配的设置。试试「字体」「模型」或「行距」。</div>';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(!e.target.closest('.search-wrap'))$('#results').hidden=true;return;}if(b.dataset.domain){const d=b.dataset.domain,p=categories[d][0][0];go(d,p,p==='appearance'?'chat':pageTasks[p][0][0]);}else if(b.dataset.page){const p=b.dataset.page;go(state.domain,p,p==='appearance'?'chat':pageTasks[p][0][0]);}else if(b.dataset.task){state.task=b.dataset.task;render(true);}else if(b.dataset.result!==undefined){const x=searchItems[+b.dataset.result];go(x[2],x[3],x[4],x[5]);}else if(b.dataset.step){const key=b.dataset.step,input=$('#'+key);setValue(key,Math.max(+input.min,Math.min(+input.max,values[key]+ +b.dataset.delta)));input.value=values[key];if(key==='uiSize')render();}else if(b.dataset.line){setValue('lineHeight',+b.dataset.line);document.querySelectorAll('[data-line]').forEach(x=>{x.classList.toggle('active',+x.dataset.line===values.lineHeight);x.setAttribute('aria-pressed',+x.dataset.line===values.lineHeight);});}else if(b.dataset.mode){setValue('mode',b.dataset.mode);render();}else if(b.dataset.toggle){const key=b.dataset.toggle;setValue(key,!values[key]);b.setAttribute('aria-checked',values[key]);}else if(b.id==='reset'){for(const k of taskKeys[state.task]||[])values[k]=initial[k];render();status('已恢复本组示例默认值');toast('当前组已恢复默认，其它设置保持原值。');}else if(b.id==='back-appearance'){go('work','appearance','chat');}else if(b.id==='exit'){toast('这是独立设计预览，可关闭页面返回工作台。');}else if(b.dataset.info){toast(b.dataset.info);}});
document.addEventListener('input',e=>{const k=e.target.dataset.value;if(k){setValue(k,e.target.type==='range'?+e.target.value:e.target.value);if(k==='uiSize'){$('.preview').style.fontSize=values.uiSize+'px';}if(k==='uiFont')$('.preview').style.fontFamily=values.uiFont==='系统默认'?'var(--ui-font)':values.uiFont;}});
$('#task-select').addEventListener('change',e=>{state.task=e.target.value;render(true);});$('#search').addEventListener('input',results);$('#search').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();$('.result')?.focus();}if(e.key==='Enter'&&$('.result')){$('.result').click();e.preventDefault();}});$('#results').addEventListener('keydown',e=>{const b=e.target.closest('.result');if(e.key==='ArrowDown'){e.preventDefault();b?.nextElementSibling?.focus();}if(e.key==='ArrowUp'){e.preventDefault();b?.previousElementSibling?.focus();}});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();$('#search').focus();$('#search').select();}if(e.key==='Escape'&&!$('#results').hidden){$('#results').hidden=true;$('#search').focus();}});
document.querySelectorAll('.logo').forEach(img=>img.src=LOGO);$('#exit').innerHTML=icon('back')+'<span>返回工作台</span>';$('#search-icon').innerHTML=icon('search');status('自动保存交互示例');render();
</script>
</body>
</html>
