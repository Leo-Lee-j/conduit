<style>

.app{height:100dvh;overflow:hidden;display:grid;grid-template-columns:216px minmax(0,1fr);padding-bottom:36px}.sidebar{overflow:auto;border-right:1px solid var(--line);padding:24px 12px;background:#f6f6f8}.back{display:flex;gap:8px;align-items:center;border:0;background:none;margin:0 8px 24px;padding:0;height:20px;font-weight:600}.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 10px;height:32px;color:var(--muted)}.search input{width:100%;min-width:0;border:0;background:transparent;font-size:12px;outline:0}.nav-group{margin-top:24px}.nav-label{color:var(--muted);font-size:12px;padding:0 10px;margin-bottom:8px}.nav-item{display:block;width:100%;height:32px;border:0;background:none;text-align:left;padding:0 10px;margin:2px 0;border-radius:6px;color:var(--secondary)}.nav-item:hover{background:#ededf2}.nav-item.active{background:#e7ecff;color:#2449d5;font-weight:600}.main{padding:32px 40px 24px;min-width:0;overflow:auto}.content{max-width:1040px;margin:auto}h1{font-size:24px;line-height:32px;font-weight:600;margin:0 0 4px}p{margin:0}.subtitle{color:var(--secondary);line-height:24px}.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin:16px 0 20px}.tab{height:44px;border:0;border-bottom:2px solid transparent;background:none;padding:0 8px;color:var(--secondary);white-space:nowrap}.tab.active{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}.default-card{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:var(--radius);padding:16px 20px;margin-bottom:24px;min-height:80px}.default-icon{display:grid;place-items:center;width:36px;height:36px;background:var(--blue-soft);border-radius:8px;color:var(--blue)}.default-copy{flex:1;min-width:0}.eyebrow{font-size:12px;color:var(--secondary);margin-bottom:6px}.default-value{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.default-value strong{font-size:14px;font-weight:600}.default-model{color:var(--secondary);font-size:13px}.dot{color:#b4b6c0}.badge{font-size:11px;font-weight:400;background:#eef6f1;color:var(--green);padding:2px 6px;border-radius:4px;white-space:nowrap}.btn{height:32px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #d9dbe4;border-radius:6px;background:white;padding:0 12px;white-space:nowrap;font-size:12px}.btn:hover{background:#f3f4f8;border-color:#c3c6d1}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#2347cf}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}.section-title{display:flex;gap:8px;align-items:baseline}h2{font-size:15px;font-weight:600;margin:0}.count{color:var(--muted);font-size:12px}.section-caption{font-size:12px;color:var(--muted);margin-top:6px}.actions{display:flex;gap:8px}.table-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:auto;background:white}table{width:100%;border-collapse:collapse;text-align:left;table-layout:fixed}th{font-weight:400;color:var(--muted);font-size:12px;background:#fafafb;height:36px;padding:0 16px;border-bottom:1px solid var(--line)}th:first-child{padding-left:20px;width:36%}th:nth-child(2){width:15%}th:nth-child(3){width:12%}th:nth-child(4){width:14%}th:last-child{width:23%;text-align:right;padding-right:20px}td{height:60px;padding:10px 16px;border-bottom:1px solid #eff0f4}tr:last-child td{border-bottom:0}td:first-child{padding-left:20px}td:last-child{padding-right:20px}tbody tr:hover{background:#fbfcff}tbody tr.is-default{background:#f7f9ff}.service-name{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}.endpoint{font-family:Consolas,"SFMono-Regular",monospace;color:var(--muted);font-size:11px;line-height:18px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.source{color:var(--secondary);font-size:12px}.text-link{border:0;background:none;color:var(--blue);padding:4px 0;display:inline-flex;align-items:center;gap:4px;font-size:12px}.text-link:hover{text-decoration:underline}.text-link svg{width:12px;height:12px}.number{font-variant-numeric:tabular-nums}.empty{color:#a2a5b0}.row-actions{display:flex;justify-content:flex-end;align-items:center;gap:12px}.set-default{font-size:12px;white-space:nowrap;border:1px solid #e1e3ea;background:white;border-radius:5px;padding:5px 8px}.set-default:hover{color:var(--blue);border-color:#bdc9ff;background:#f8faff}.current{color:var(--green);font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap}.current svg{width:14px;height:14px}.icon-btn{border:0;background:transparent;padding:6px;display:inline-flex;border-radius:5px;color:var(--muted)}.icon-btn:hover{background:#edf0f7;color:var(--ink)}.helper{display:flex;gap:8px;color:var(--muted);font-size:12px;line-height:20px;margin-top:16px}.helper svg{margin-top:2px;width:14px;height:14px}.footer{position:fixed;bottom:0;left:0;right:0;height:36px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:var(--muted);font-size:11px;z-index:2}.footer span{display:flex;gap:6px;align-items:center}.footer svg{width:12px;height:12px}.preview-note{color:#8a8e9b}.toast{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);background:#282b35;color:white;border-radius:8px;padding:12px 20px;box-shadow:0 4px 20px #0002;z-index:20;font-size:13px;max-width:calc(100vw - 32px);line-height:22px}
dialog{padding:0;color:var(--ink);border:0;background:white}dialog::backdrop{background:rgba(29,34,49,.16)}.drawer{position:fixed;inset:0 0 36px auto;margin:0;height:calc(100dvh - 36px);max-height:none;width:440px;max-width:100vw;border-left:1px solid var(--line);box-shadow:-8px 0 32px #1c243510}.drawer[open]{display:flex;flex-direction:column}.drawer-head{flex-shrink:0;padding:28px 24px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}.drawer-head h2{font-size:20px;margin:4px 0 8px}.drawer-meta{font-size:12px;color:var(--muted)}.drawer-tabs{flex-shrink:0;display:flex;gap:24px;margin:0 24px;border-bottom:1px solid var(--line)}.drawer-body{padding:24px;overflow:auto;flex:1;min-height:0}.detail-note{font-size:12px;line-height:20px;color:var(--muted);margin-bottom:20px}.model-row{padding:16px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.model-row strong{font-size:13px;font-weight:500}.model-row small{display:block;color:var(--muted);font-size:11px;margin-top:6px}.session{padding:16px 0;border-bottom:1px solid var(--line)}.session p{font-size:13px;line-height:22px}.session small{display:block;color:var(--muted);font-size:11px;margin-top:6px}.drawer-actions{flex-shrink:0;padding:20px 24px;border-top:1px solid var(--line);margin-top:0;display:flex;justify-content:space-between;gap:12px}.modal{width:440px;max-width:calc(100vw - 32px);border-radius:12px;padding:24px;box-shadow:0 12px 48px #0002}.modal h2{font-size:20px}.modal p{color:var(--secondary);font-size:12px;line-height:20px;margin:12px 0 20px}.field{display:block;margin:16px 0;font-size:12px;color:var(--secondary)}.field input{display:block;margin-top:8px;width:100%;border:1px solid #d9dbe4;border-radius:6px;padding:10px 12px;color:var(--ink)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}.no-nav{padding:12px 10px;color:var(--muted);font-size:12px}
@media(min-width:1450px){.main{padding-top:48px}}@media(max-width:1080px){.main{padding:28px 24px}th:first-child{width:34%}th:nth-child(2){width:14%}th:nth-child(3){width:12%}th:nth-child(4){width:14%}th:last-child{width:26%}.row-actions{gap:6px}}
@media(max-width:760px){.app{grid-template-columns:160px 1fr}.main{padding:24px 16px}.sidebar{padding:24px 8px}.tabs{gap:12px;overflow:auto}.default-card{padding:16px;gap:12px;flex-wrap:wrap}.default-icon{display:none}.default-copy{flex-basis:65%}.section-head{align-items:flex-start;flex-direction:column;gap:12px}table{min-width:650px}.footer .preview-note{display:none}.drawer{width:400px}}
@media(max-width:520px){.app{grid-template-columns:1fr}.sidebar{display:none}.main{padding:24px 16px}.footer{padding:0 12px}.default-card{gap:12px}.default-card>.btn{margin-top:4px}h1{font-size:22px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main class="main"><div class="content"><header><h1>模型与服务</h1><p class="subtitle">管理服务连接与可用模型</p></header><div class="tabs" role="tablist" aria-label="CLI 引擎"><button class="tab" role="tab" aria-selected="false" data-engine="Claude Code">Claude Code</button><button class="tab active" role="tab" aria-selected="true" id="codex-tab" aria-controls="codex-panel">Codex</button><button class="tab" role="tab" aria-selected="false" data-engine="OpenCode">OpenCode</button><button class="tab" role="tab" aria-selected="false" data-engine="Qoder CLI">Qoder CLI</button></div>
<section id="codex-panel" role="tabpanel" aria-labelledby="codex-tab"><div class="default-card"><div class="default-icon"><svg><use href="#terminal"/></svg></div><div class="default-copy"><p class="eyebrow">Codex 新会话默认使用</p><div class="default-value"><strong id="default-name">CLI 原生配置</strong><span class="dot">·</span><span class="default-model" id="default-model">gpt-6.1-terra</span></div></div><button class="btn" id="manage-default">管理模型目录<svg><use href="#chevron"/></svg></button></div>
<div class="section-head"><div><div class="section-title"><h2>模型服务</h2><span class="count" id="service-count">8 个</span></div><p class="section-caption">默认设置仅用于新会话，已有会话保持原配置</p></div><div class="actions"><button class="btn" id="reload"><svg><use href="#refresh"/></svg>重新读取配置</button><button class="btn primary" id="add"><svg><use href="#plus"/></svg>添加服务</button></div></div>
<div class="table-wrap"><table aria-label="Codex 模型服务"><thead><tr><th scope="col">服务</th><th scope="col">管理来源</th><th scope="col">模型</th><th scope="col">使用会话</th><th scope="col">操作</th></tr></thead><tbody id="services"></tbody></table></div>
<div class="helper"><svg><use href="#info"/></svg><p>cc-switch 管理的服务在原应用中编辑。点击模型或会话数量，可查看详情。</p></div></section></div></main></div>
<footer class="footer"><span><svg><use href="#check"/></svg><span id="save-status">偏好设置自动保存</span></span><span class="preview-note">设计预览 · 示例数据与更改仅在当前页面生效</span></footer>
<div id="toast" class="toast" role="status" hidden></div>
<dialog class="drawer" id="details" aria-labelledby="detail-title"><div class="drawer-head"><div><p class="eyebrow" id="detail-source"></p><h2 id="detail-title"></h2><p class="drawer-meta" id="detail-url"></p></div><button class="icon-btn" id="close-details" aria-label="关闭详情"><svg><use href="#close"/></svg></button></div><div class="drawer-tabs" role="tablist" aria-label="服务详情"><button class="tab active" id="models-tab" role="tab" aria-selected="true" aria-controls="detail-body">模型</button><button class="tab" id="sessions-tab" role="tab" aria-selected="false" aria-controls="detail-body">使用会话</button></div><div class="drawer-body" id="detail-body" role="tabpanel" aria-labelledby="models-tab"></div><div class="drawer-actions"><button class="btn" id="detail-edit">在 cc-switch 中编辑<svg><use href="#external"/></svg></button><button class="btn primary" id="detail-default">设为新会话默认</button></div></dialog>
<dialog class="modal" id="add-dialog" aria-labelledby="add-title"><form id="add-form"><h2 id="add-title">添加模型服务</h2><p>预览服务添加流程。这里填写的内容仅保留在当前页面，请勿输入真实密钥。</p><label class="field">服务名称<input name="name" required maxlength="40" placeholder="例如：团队服务"></label><label class="field">接口地址<input name="url" required type="url" placeholder="https://api.example.com/v1"></label><div class="modal-actions"><button class="btn" type="button" id="cancel-add">取消</button><button class="btn primary" type="submit">添加服务</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id);
const icon=name=>`<svg aria-hidden="true"><use href="#${name}"/></svg>`;
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const services=[{name:'ARK',url:'https://windhub.cc',models:4,sessions:0},{name:'anyrouter',url:'https://anyrouter.top/v1',models:2,sessions:8},{name:'南梁API',url:'https://api.llm.pm/v1',models:1,sessions:1},{name:'superqiyu',url:'https://www.superqiyu.org/v1',models:2,sessions:2},{name:'nexavlinks',url:'https://www.nexavlinks.com/v1',models:1,sessions:0},{name:'千刀佬',url:'https://api666.zzzcoding.org/v1',models:2,sessions:1},{name:'公司',url:'https://subclaude.tec-do.cn',models:4,sessions:3},{name:'星驰API公益站',url:'https://api.xingchiapi.com',models:2,sessions:0}].map((s,id)=>({...s,id,source:'cc-switch'}));
const native={id:-1,name:'CLI 原生配置',url:'使用 Codex CLI 的原生认证与模型配置',models:10,sessions:0,source:'CLI 原生配置'};
let defaultId=-1,selected=native,detailTab='models',toastTimer;
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3600)}
function render(){
 $('services').innerHTML=services.map(s=>`<tr class="${defaultId===s.id?'is-default':''}"><td><div class="service-name">${escapeHTML(s.name)}</div><div class="endpoint" title="${escapeHTML(s.url)}">${escapeHTML(s.url.replace(/^https?:\/\//,''))}</div></td><td><span class="source">${escapeHTML(s.source)}</span></td><td><button class="text-link number" data-action="models" data-id="${s.id}" aria-label="查看 ${escapeHTML(s.name)} 的 ${s.models} 个模型">${s.models} 个${icon('chevron')}</button></td><td>${s.sessions?`<button class="text-link number" data-action="sessions" data-id="${s.id}" aria-label="查看使用 ${escapeHTML(s.name)} 的 ${s.sessions} 个会话">${s.sessions} 个${icon('chevron')}</button>`:'<span class="empty">—</span>'}</td><td><div class="row-actions">${defaultId===s.id?`<span class="current">${icon('check')}当前默认</span>`:`<button class="set-default" data-action="default" data-id="${s.id}" aria-label="将 ${escapeHTML(s.name)} 设为新会话默认">设为默认</button>`}<button class="icon-btn" data-action="edit" data-id="${s.id}" title="${s.source==='cc-switch'?'在 cc-switch 中编辑':'编辑本地服务'}" aria-label="编辑 ${escapeHTML(s.name)}">${icon('external')}</button></div></td></tr>`).join('');
 const current=defaultId===-1?native:services.find(s=>s.id===defaultId);$('default-name').textContent=current.name;$('default-model').textContent=defaultId===-1?'gpt-6.1-terra':'跟随服务默认模型';$('service-count').textContent=`${services.length} 个`;
}
function setDefault(id){defaultId=id;render();if($('details').open)renderDetail();toast('已更新新会话默认服务，已有会话保持不变');$('save-status').textContent='默认设置已更新'}
function openDetails(service,tab='models'){selected=service;detailTab=tab;renderDetail();if(!$('details').open)$('details').showModal()}
function renderDetail(){
 $('detail-title').textContent=selected.name;$('detail-source').textContent=selected.source==='cc-switch'?'由 cc-switch 管理':selected.source;$('detail-url').textContent=selected.url;$('models-tab').textContent=`模型 · ${selected.models}`;$('sessions-tab').textContent=`使用会话 · ${selected.sessions}`;
 for(const tab of ['models','sessions']){$(`${tab}-tab`).classList.toggle('active',detailTab===tab);$(`${tab}-tab`).setAttribute('aria-selected',String(detailTab===tab))}$('detail-body').setAttribute('aria-labelledby',`${detailTab}-tab`);
 if(detailTab==='models'){$('detail-body').innerHTML=`<p class="detail-note">${selected.id===-1?'原生配置包含 10 个模型定义，尚未验证生成能力。':'此处展示服务的模型目录。模型名称为布局示例，实际内容以服务配置为准。'}</p>`+Array.from({length:selected.models},(_,i)=>`<div class="model-row"><div><strong>${selected.id===-1&&i===0?'gpt-6.1-terra':`模型 ${String(i+1).padStart(2,'0')}`}</strong><small>${selected.id===-1&&i===0?'来自原生模型目录':'模型定义 · 示例'}</small></div>${i===0?'<span class="badge">默认模型</span>':''}</div>`).join('')}
 else{const titles=['继续完成这个 code…','整体 review 下代码，包括性能、架构设计、代码风格等','评估在设置弹窗添加 CLI 的 skill & mcp 列表展示'];$('detail-body').innerHTML=`<p class="detail-note">${selected.sessions?'这些会话保留各自的服务配置，不受新会话默认设置影响。':'目前没有会话使用此服务。'}</p>`+Array.from({length:selected.sessions},(_,i)=>`<div class="session"><p>${escapeHTML(titles[i]||`示例会话 ${i+1}`)}</p><small>conduit${i>=3?' · 布局示例':''}</small></div>`).join('')}
 $('detail-default').disabled=defaultId===selected.id;$('detail-default').textContent=defaultId===selected.id?'当前新会话默认':'设为新会话默认';$('detail-edit').innerHTML=selected.source==='cc-switch'?`在 cc-switch 中编辑${icon('external')}`:'编辑模型目录';
}
$('services').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const s=services.find(s=>s.id===Number(b.dataset.id));if(b.dataset.action==='default')setDefault(s.id);else if(b.dataset.action==='edit')toast(s.source==='cc-switch'?'正式版将在 cc-switch 中打开此服务；当前为设计预览':'当前为本地服务编辑入口的设计预览');else openDetails(s,b.dataset.action)});
$('manage-default').onclick=()=>openDetails(defaultId===-1?native:services.find(s=>s.id===defaultId));$('defaults-nav').onclick=()=>openDetails(native);$('close-details').onclick=()=>$('details').close();$('models-tab').onclick=()=>{detailTab='models';renderDetail()};$('sessions-tab').onclick=()=>{detailTab='sessions';renderDetail()};$('detail-default').onclick=()=>setDefault(selected.id);$('detail-edit').onclick=()=>toast('当前展示模型管理入口，正式版连接配置编辑器');
$('reload').onclick=()=>toast('预览数据已重新显示；正式版将读取本机配置');$('add').onclick=()=>$('add-dialog').showModal();$('cancel-add').onclick=()=>$('add-dialog').close();$('add-form').onsubmit=e=>{e.preventDefault();const data=new FormData(e.target);const url=new URL(data.get('url'));if(!['https:','http:'].includes(url.protocol)){toast('请输入 http 或 https 接口地址');return}const name=data.get('name').trim();if(!name){toast('请输入服务名称');return}services.push({id:services.length,name,url:url.href,models:0,sessions:0,source:'本地配置'});render();$('add-dialog').close();e.target.reset();toast('服务已添加到当前预览')};
$('nav-search').oninput=e=>{let total=0;document.querySelectorAll('.nav-group').forEach(group=>{let visible=0;group.querySelectorAll('.nav-item').forEach(item=>{item.hidden=!item.textContent.toLowerCase().includes(e.target.value.trim().toLowerCase());if(!item.hidden)visible++});group.hidden=!visible;total+=visible});$('nav-empty').hidden=total>0};
 document.querySelectorAll('[data-engine]').forEach(b=>b.onclick=()=>toast(`本次设计预览聚焦 Codex；${b.dataset.engine} 沿用同一布局`));document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>toast(`当前为「模型与服务」设计预览，未接入「${b.dataset.demo}」页面`));
 for(const dialog of document.querySelectorAll('dialog'))dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});
 render();
</script>
</body></html>
