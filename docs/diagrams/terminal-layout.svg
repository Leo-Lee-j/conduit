  <text x="892" y="395" class="small accent">发送</text>
  <rect x="248" y="428" width="783" height="6" fill="#354254"/>
  <rect x="607" y="429" width="62" height="4" rx="2" fill="#8da5c5"/>
  <rect x="248" y="434" width="783" height="42" fill="#1c283a"/>
  <text x="263" y="460" style="font-weight:600">终端 · 项目 A</text>
  <rect x="380" y="441" width="145" height="29" rx="4" fill="#304566"/>
