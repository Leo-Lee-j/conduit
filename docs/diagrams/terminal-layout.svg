  <text x="267" y="604" class="mono">PS D:\projects\A&gt;</text>
  <rect x="442" y="589" width="9" height="20" fill="#c0d1ef"/>
  <text x="267" y="660" class="small muted">收起保留进程　·　Ctrl+Shift+C 复制选区　·　Ctrl+Shift+V 粘贴</text>
  <path d="M248 690 H1032" class="line"/>
  <text x="264" y="713" class="small muted">工作区 A</text>
  <rect x="810" y="696" width="80" height="24" rx="4" fill="#304566"/>
  <text x="824" y="712" class="small">终端 2</text>
  <text x="906" y="713" class="small muted">性能　通知</text>
  <text x="28" y="762" style="fill:#172b4d;font-weight:600">新建使用活动工作区；已有 shell 保留目录、输出与进程。</text>
  <text x="28" y="790" style="fill:#52647d">窄窗保留新建/收起入口；高度不足时终端占满中间区，可一键返回。颜色为示意，实施沿用应用主题。</text>
</svg>
